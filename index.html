document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n        <div style=\"margin-top:12px;font-size:11px;color:#9aa4b2;line-height:1.5\">Sources de référence : OMS (Disease Outbreak News, tableaux de bord), ECDC, Africa CDC, OPS. Bascule « Régional » pour revenir au périmètre Océan Indien / Afrique de l'Est.<\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ═══ CARTE MONDIALE (onglet Carte en mode Mondial) ═══ -->\n      <sc-if value=\"{{ isMondialCarte }}\">\n      <div>\n        <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap\">\n          <label style=\"font-size:13px;font-weight:600;color:#46505f\">Pathogène<\u002Flabel>\n          <sc-raw-select value=\"{{ mapPatho }}\" sc-camel-on-change=\"{{ onMapChange }}\" style=\"font-family:inherit;font-size:13px;padding:8px 12px;border:1px solid #d7dde5;border-radius:9px;background:#fff;color:#012a68;min-width:230px;cursor:pointer\">\n            <sc-for list=\"{{ mapOptions }}\" as=\"o\" hint-placeholder-count=\"11\">\n              <option value=\"{{ o.id }}\">{{ o.name }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n          <div style=\"font-size:12px;color:#9aa4b2;margin-left:auto\">{{ mapName }} · cliquez un pays · molette pour zoomer<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #e6eaf0;border-radius:14px;box-shadow:0 1px 2px rgba(20,30,50,.04);overflow:hidden\">\n          <div id=\"reb-map-world\" style=\"position:relative;height:560px;background:radial-gradient(120% 120% at 60% 25%, #eef5fb 0%, #e3eef7 60%, #dbe8f3 100%)\">\n            <div class=\"reb-map-loading\" style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9aa4b2;font-size:12px\">Chargement de la carte…<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:16px;flex-wrap:wrap;padding:13px 18px;border-top:1px solid #eef1f5;background:#fafbfc\">\n or:pointer\">\n            <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#5d6675;font-weight:700\">Foyers actifs<\u002Fdiv>\n            <div class=\"num\" style=\"font-size:40px;font-weight:800;letter-spacing:-.03em;margin-top:2px;color:#012a68;font-variant-numeric:tabular-nums\">{{ kpiFoyers }}<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:5px;margin-top:9px\">\n              <sc-if value=\"{{ kpiFoyersEmpty }}\"><div style=\"font-size:11px;color:#9aa4b2\">—<\u002Fdiv><\u002Fsc-if>\n              <sc-for list=\"{{ kpiFoyersItems }}\" as=\"f\" hint-placeholder-count=\"2\">\n                <div style=\"display:flex;align-items:center;gap:6px;border-top:1px solid #f1f4f8;padding-top:5px\">\n                  <span style=\"width:6px;height:6px;border-radius:50%;background:{{ f.dot }};flex-shrink:0\"><\u002Fspan>\n                  <span style=\"font-size:11.5px;font-weight:700;color:#012a68;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ f.patho }}<\u002Fspan>\n                  <span style=\"font-size:11px;color:#b32525;font-weight:600;margin-left:auto;white-space:nowrap\">{{ f.zone }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ onGoAlertes }}\" style=\"background:#fff;border:1px solid #dbe1ea;border-radius:12px;padding:15px 16px;box-shadow:0 1px 2px rgba(20,30,50,.05);cursor:pointer\">\n            <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#5d6675;font-weight:700\">Décès confirmés<\u002Fdiv>\n            <div class=\"num\" style=\"font-size:40px;font-weight:800;letter-spacing:-.03em;margin-top:2px;color:#012a68;font-variant-numeric:tabular-nums\">{{ kpiDeces }}<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:5px;margin-top:9px\">\n              <sc-for list=\"{{ kpiDecesByAgent }}\" as=\"d\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-top:1px solid #f1f4f8;padding-top:5px\">\n                  <span style=\"font-size:11.5px;color:#3c4757;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ d.name }}<\u002Fspan>\n                  <span style=\"font-size:11px;color:#9aa4b2;white-space:nowrap\"><span style=\"font-weight:700;color:#b32525;font-variant-numeric:tabular-nums\">{{ d.dec }}<\u002Fspan> · {{ d.period }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ onGoAlertes }}\" style=\"background:#fff;border:1px solid #e6eaf0;border-radius:12px;padding:17px 18px;box-shadow:0 1px 2px rgba(20,30,50,.04);cursor:pointer\">\n            <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#5d6675;font-weight:700\">Pathogènes en alerte<\u002Fdiv>\n            <div class=\"num\" style=\"font-size:27px;font-weight:800;letter-spacing:-.02em;margin-top:3px;color:#012a68;font-variant-numeric:tabular-nums\">{{ kpiPathAlerte }}<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:5px;margin-top:9px\">\n              <sc-if value=\"{{ kpiPathEmpty }}\"><div style=\"font-size:11px;color:#9aa4b2\">—<\u002Fdiv><\u002Fsc-if>\n              <sc-for list=\"{{ kpiPathItems }}\" as=\"p\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;align-items:center;gap:6px;border-top:1px solid #f1f4f8;padding-top:5px\">\n                  <span style=\"width:6px;height:6px;border-radius:50%;background:{{ p.dot }};flex-shrink:0\"><\u002Fspan>\n                  <span style=\"font-size:11.5px;font-weight:700;color:#012a68;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ p.patho }}<\u002Fspan>\n                  <span style=\"font-size:10px;color:#9aa4b2;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px\">{{ p.group }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ onGoAlertes }}\" style=\"background:#fff;border:1px solid #e6eaf0;border-radius:12px;padding:17px 18px;box-shadow:0 1px 2px rgba(20,30,50,.04);cursor:pointer\">\n            <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#5d6675;font-weight:700\">Tendance globale<\u002Fdiv>\n            <div style=\"font-size:19px;font-weight:800;letter-spacing:-.01em;margin-top:6px;color:{{ kpiTrendColor }}\">{{ kpiTrendMain }}<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:5px;margin-top:9px\">\n              <sc-if value=\"{{ kpiTrendEmpty }}\"><div style=\"font-size:11px;color:#9aa4b2\">pas assez de recul<\u002Fdiv><\u002Fsc-if>\n              <sc-for list=\"{{ kpiTrendItems }}\" as=\"t\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;align-items:center;gap:6px;border-top:1px solid #f1f4f8;padding-top:5px\">\n                  <span style=\"font-size:11.5px;font-weight:700;color:#012a68;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ t.patho }}<\u002Fspan>\n                  <span style=\"font-size:12px;font-weight:700;color:{{ t.color }};margin-left:auto\">{{ t.arrow }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Deux colonnes en pleine largeur : alertes à gauche, point Réunion à droite ;\n             elles se replient l'une sous l'autre en dessous de ~1080px. -->\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:13px;align-items:start\">\n          <section style=\"background:#fff;border:1px solid #dbe1ea;border-radius:14px;box-shadow:0 1px 2px rgba(20,30,50,.05);overflow:hidden\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid #eef1f5\">\n              <div style=\"font-size:14px;font-weight:700\">Pathogènes en alerte<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#9aa4b2\">classés par niveau<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:8px\">\n              <sc-for list=\"{{ alerts }}\" as=\"a\" hint-placeholder-count=\"4\">\n                <div style=\"padding:13px 12px;border-radius:10px;display:flex;flex-direction:column;gap:9px;border-bottom:1px solid #f1f4f8\">\n                  <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:10px\">\n                    <div>\n                      <div style=\"font-size:14px;font-weight:700;letter-spacing:-.01em\">{{ a.name }}<\u002Fdiv>\n                      <div style=\"font-size:11px;color:#8a93a1;margin-top:1px\">{{ a.group }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <span style=\"{{ a.badgeStyle }}\">{{ a.badgeLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-size:11px;color:#79828f;background:#f6f8fa;border:1px solid #eef1f5;border-radius:6px;padding:5px 9px;display:inline-block;align-self:flex-start\"><span style=\"color:#9aa4b2\">Période :<\u002Fspan> {{ a.period }}<\u002Fdiv>\n                  <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n                    <sc-for list=\"{{ a.zones }}\" as=\"z\" hint-placeholder-count=\"2\">\n                      <div style=\"display:flex;align-items:center;gap:7px;background:#f6f8fa;border:1px solid #eaeef3;border-radius:7px;padding:5px 9px\">\n                        <span style=\"width:7px;height:7px;border-radius:50%;background:{{ z.dot }}\"><\u002Fspan>\n                        <span style=\"font-size:12px;font-weight:600\">{{ z.zone }}<\u002Fspan>\n                        <span class=\"num\" style=\"font-size:11px;color:#79828f\">{{ z.stat }}<\u002Fspan>\n                        <sc-if value=\"{{ z.hasBasis }}\"><span title=\"{{ z.basisTitle }}\" style=\"{{ z.basisStyle }};font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px;letter-spacing:.02em;cursor:help\">{{ z.basisLabel }}<\u002Fspan><\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n        <!-- ENCART BULLETIN HEBDO LA RÉUNION -->\n        <section style=\"background:#fff;border:1px solid #dbe1ea;border-radius:14px;box-shadow:0 1px 2px rgba(20,30,50,.05);overflow:hidden\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:15px 18px;border-bottom:1px solid #eef1f5\">\n            <div style=\"display:flex;align-items:center;gap:9px\">\n              <span style=\"font-size:15px\">🌴<\u002Fspan>\n              <div>\n                <div style=\"font-size:14px;font-weight:700\">Bulletin hebdomadaire — La Réunion<\u002Fdiv>\n                <div style=\"font-size:11px;color:#8a93a1;margin-top:1px\">Santé publique France · surveillance Océan Indien · lecture automatique du bulletin (page + PDF), API Odissé en complément<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"font-size:11px;color:#79828f;background:#f6f8fa;border:1px solid #eef1f5;border-radius:6px;padding:4px 10px\">{{ reunionDate }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hasReunionBull }}\">\n            <div style=\"padding:9px 18px;background:#f0f6ff;border-bottom:1px solid #e2ecfd;font-size:11.5px;color:#006bcd\">\n              <a href=\"{{ reunionBullUrl }}\" target=\"_blank\" rel=\"noreferrer\" style=\"color:#006bcd;font-weight:600;text-decoration:none\">{{ reunionBullLabel }}<\u002Fa>\n              <span style=\"color:#79828f\"> · source des quatre indicateurs ci-dessous (dengue, chikungunya, leptospirose, mpox), extraits automatiquement ; page mpox de l'ARS La Réunion en repli. Grippe et bronchiolite restent qualitatives dans le bulletin.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ reunionEmpty }}\">\n            <div style=\"padding:24px 18px;text-align:center;color:#9aa4b2;font-size:12.5px\">Aucun indicateur local disponible pour l'instant.<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:#eef1f5\">\n            <sc-for list=\"{{ reunionIndics }}\" as=\"r\" hint-placeholder-count=\"4\">\n              <div style=\"background:#fff;padding:14px 16px\">\n                <div style=\"font-size:11.5px;color:#79828f;font-weight:500\">{{ r.label }}<\u002Fdiv>\n                <div style=\"display:flex;align-items:baseline;gap:7px;margin-top:5px\">\n                  <span class=\"num\" style=\"font-size:22px;font-weight:800;letter-spacing:-.02em;color:#012a68\">{{ r.cas }}<\u002Fspan>\n                  <sc-if value=\"{{ r.hasTrend }}\"><span style=\"{{ r.arrowStyle }}\">{{ r.arrow }}<\u002Fspan><\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"font-size:10.5px;color:#3c4757;margin-top:5px;line-height:1.4\">{{ r.basis }}<\u002Fdiv>\n                <div style=\"font-size:10.5px;color:#5d6675;font-weight:600;margin-top:2px\">{{ r.asOf }}<\u002Fdiv>\n                <div style=\"font-size:10px;color:#9aa4b2;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ r.sub }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ═══ SYNTHÈSE ═══ -->\n      <sc-if value=\"{{ isSynthese }}\">\n      <div>\n        <div style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:18px\">\n          <div style=\"font-size:12.5px;color:#79828f\">Tableau de synthèse épidémiologique · un bloc par pathogène actif<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n            <div style=\"position:relative;display:flex;align-items:center\">\n              <span style=\"position:absolute;left:11px;font-size:13px;color:#aab2bf;pointer-events:none\">⌕<\u002Fspan>\n              <input value=\"{{ sq }}\" sc-camel-on-input=\"{{ onSq }}\" placeholder=\"Filtrer…\" style=\"font-family:inherit;font-size:13px;padding:8px 12px 8px 30px;border:1px solid #d7dde5;border-radius:9px;background:#fff;color:#012a68;width:170px;outline:none\">\n            <\u002Fdiv>\n            <div style=\"font-size:11px;color:#79828f;background:#fff;border:1px solid #e6eaf0;padding:5px 10px;border-radius:7px\"><span style=\"color:#9aa4b2\">NA<\u002Fspan> = non disponible dans les sources<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ synthEmpty }}\">\n          <div style=\"background:#fff;border:1px dashed #d4dae2;border-radius:12px;padding:40px;text-align:center;color:#9aa4b2;font-size:13px\">Aucun pathogène ne correspond à votre filtre.<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-for list=\"{{ synth }}\" as=\"b\" hint-placeholder-count=\"3\">\n          <section style=\"background:#fff;border:1px solid #e6eaf0;border-radius:14px;box-shadow:0 1px 2px rgba(20,30,50,.04);overflow:hidden;margin-bottom:18px\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:14px 18px;border-bottom:1px solid #eef1f5\">\n              <div style=\"display:flex;align-items:center;gap:11px\">\n                <span style=\"font-size:15px;font-weight:700;letter-spacing:-.01em\">{{ b.name }}<\u002Fspan>\n                <span style=\"{{ b.badgeStyle }}\">{{ b.badgeLabel }}<\u002Fspan>\n                <span style=\"{{ b.freshPillStyle }}\"><span style=\"width:7px;height:7px;border-radius:50%;background:{{ b.freshDot }}\"><\u002Fspan>{{ b.freshLabel }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:11px;color:#9aa4b2\">{{ b.meta }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:13px\">\n              <div style=\"display:grid;grid-template-columns:1fr 130px 130px 130px;background:#fafbfc;border-bottom:1px solid #eef1f5\">\n                <div style=\"padding:9px 18px;text-align:left;font-size:11px;font-weight:600;color:#79828f\">Zone<\u002Fdiv>\n                <div style=\"padding:9px 12px;text-align:right;font-size:11px;font-weight:600;color:#b32525;white-space:nowrap\">Cas confirmés<\u002Fdiv>\n                <div style=\"padding:9px 12px;text-align:right;font-size:11px;font-weight:600;color:#7a1f1f;white-space:nowrap\">Décès confirmés<\u002Fdiv>\n                <div style=\"padding:9px 18px 9px 12px;text-align:right;font-size:11px;font-weight:600;color:#8a6312;white-space:nowrap\">Cas suspects<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-for list=\"{{ b.rows }}\" as=\"r\" hint-placeholder-count=\"2\">\n                <div style=\"display:grid;grid-template-columns:1fr 130px 130px 130px;{{ r.rowStyle }}\">\n                  <div style=\"padding:9px 18px;text-align:left;color:#012a68\">{{ r.zone }}<\u002Fdiv>\n                  <div style=\"{{ r.confStyle }}\">{{ r.conf }}<\u002Fdiv>\n                  <div style=\"{{ r.decStyle }}\">{{ r.dec }}<\u002Fdiv>\n                  <div style=\"{{ r.suspStyle }};padding-right:18px\">{{ r.susp }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ b.hasCfr }}\" hint-placeholder-val=\"{{ b.hasCfr }}\">\n              <div style=\"padding:10px 18px;background:#fafbfc;border-top:1px solid #eef1f5;font-size:12px;color:#4a5360\">\n                <span style=\"font-weight:600\">Létalité observée (CFR) :<\u002Fspan> {{ b.cfr }}\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsection>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ═══ CARTE ═══ -->\n      <sc-if value=\"{{ isCarte }}\">\n      <div>\n        <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap\">\n          <label style=\"font-size:13px;font-weight:600;color:#46505f\">Pathogène<\u002Flabel>\n          <sc-raw-select value=\"{{ mapPatho }}\" sc-camel-on-change=\"{{ onMapChange }}\" style=\"font-family:inherit;font-size:13px;padding:8px 12px;border:1px solid #d7dde5;border-radius:9px;background:#fff;color:#012a68;min-width:230px;cursor:pointer\">\n            <sc-for list=\"{{ mapOptions }}\" as=\"o\" hint-placeholder-count=\"8\">\n              <option value=\"{{ o.id }}\">{{ o.name }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n          <div style=\"font-size:12px;color:#9aa4b2;margin-left:auto\">Niveau d'alerte par zone · {{ mapName }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #e6eaf0;border-radius:14px;box-shadow:0 1px 2px rgba(20,30,50,.04);overflow:hidden\">\n          <div id=\"reb-map-regional\" style=\"position:relative;height:480px;background:radial-gradient(120% 120% at 70% 20%, #eef5fb 0%, #e3eef7 55%, #dbe8f3 100%)\">\n            <div style=\"position:absolute;left:14px;top:12px;font-size:11px;color:#9fb0c2;font-weight:600;letter-spacing:.03em;z-index:3;pointer-events:none\">OCÉAN INDIEN · AFRIQUE DE L'EST<\u002Fdiv>\n            <div class=\"reb-map-loading\" style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9aa4b2;font-size:12px\">Chargement de la carte…<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:16px;flex-wrap:wrap;padding:13px 18px;border-top:1px solid #eef1f5;background:#fafbfc\">\n            <div style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:13px;height:13px;border-radius:4px;background:#e7f4ea;border:1.5px solid #9ccba8\"><\u002Fspan><span style=\"font-size:11px;color:#79828f\">1 · Surveillance<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:13px;height:13px;border-radius:4px;background:#fdf3d6;border:1.5px solid #e3c873\"><\u002Fspan><span style=\"font-size:11px;color:#79828f\">2 · Veille renforcée<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:13px;height:13px;border-radius:4px;background:#fce8d8;border:1.5px solid #e6ac7e\"><\u002Fspan><span style=\"font-size:11px;color:#79828f\">3 · Alerte<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:13px;height:13px;border-radius:4px;background:#fbe3e3;border:1.5px solid #e09a9a\"><\u002Fspan><span style=\"font-size:11px;color:#79828f\">4 · Urgence<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:11px;color:#aab2bf;margin-left:auto;align-self:center\">Fond de carte Natural Earth · projeté avec D3<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ═══ CARTE DE CHALEUR ═══ -->\n      <sc-if value=\"{{ isHeatmap }}\">\n      <div>\n        <div style=\"font-size:12.5px;color:#79828f;margin-bottom:14px\">Matrice pathogènes × zones · intensité du niveau d'alerte<\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #e6eaf0;border-radius:14px;box-shadow:0 1px 2px rgba(20,30,50,.04);overflow-x:auto\">\n          <div style=\"min-width:780px\">\n            <div style=\"display:grid;grid-template-columns:150px repeat(10,63px);background:#fafbfc\">\n              <div style=\"padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:#79828f;position:sticky;left:0;background:#fafbfc\">Pathogène<\u002Fdiv>\n              <sc-for list=\"{{ heatCols }}\" as=\"z\" hint-placeholder-count=\"10\">\n                <div style=\"padding:10px 4px;text-align:center;font-size:10.5px;font-weight:600;color:#79828f;white-space:nowrap\">{{ z }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-for list=\"{{ heatRows }}\" as=\"r\" hint-placeholder-count=\"8\">\n              <sc-if value=\"{{ r.isGroup }}\">\n                <div style=\"padding:6px 14px;background:#eef2f7;font-size:10px;font-weight:700;color:#5c6678;text-transform:uppercase;letter-spacing:.06em\">{{ r.label }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ r.isPatho }}\">\n                <div style=\"display:grid;grid-template-columns:150px repeat(10,63px)\">\n                  <div style=\"padding:8px 14px;font-size:12.5px;font-weight:500;color:#012a68;position:sticky;left:0;background:#fff;border-right:1px solid #eef1f5;white-space:nowrap\">{{ r.name }}<\u002Fdiv>\n                  <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"10\">\n                    <div style=\"{{ c.style }}\">{{ c.label }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:9px 20px;align-items:center;margin-top:14px;padding:0 2px\">\n          <span style=\"font-size:11px;font-weight:700;color:#79828f;text-transform:uppercase;letter-spacing:.05em\">Niveau d'alerte<\u002Fspan>\n          <div style=\"display:flex;align-items:center;gap:7px\"><span style=\"width:24px;height:20px;border-radius:5px;background:#f1f4f8;border:1px solid #dbe1ea;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#8a93a1\">0<\u002Fspan><span style=\"font-size:11.5px;color:#3c4757\">Aucun signal<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:7px\"><span style=\"width:24px;height:20px;border-radius:5px;background:#e7f4ea;border:1px solid #9ccba8;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#2c7a44\">1<\u002Fspan><span style=\"font-size:11.5px;color:#3c4757\">Surveillance<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:7px\"><span style=\"width:24px;height:20px;border-radius:5px;background:#fdf3d6;border:1px solid #e3c873;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#8a6312\">2<\u002Fspan><span style=\"font-size:11.5px;color:#3c4757\">Veille renforcée<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:7px\"><span style=\"width:24px;height:20px;border-radius:5px;background:#fce8d8;border:1px solid #e6ac7e;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#a85a1c\">3<\u002Fspan><span style=\"font-size:11.5px;color:#3c4757\">Alerte<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:7px\"><span style=\"width:24px;height:20px;border-radius:5px;background:#fbe3e3;border:1px solid #e09a9a;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#b32525\">4<\u002Fspan><span style=\"font-size:11.5px;color:#3c4757\">Urgence<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ═══ FICHE PAYS ═══ -->\n      <sc-if value=\"{{ isPays }}\">\n      <div>\n        <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px\">\n          <div>\n            <div style=\"font-size:12.5px;color:#79828f;margin-bottom:8px\">Situation épidémiologique par pays · tous les pathogènes surveillés<\u002Fdiv>\n            <sc-raw-select value=\"{{ paysSel }}\" sc-camel-on-change=\"{{ onPaysChange }}\" style=\"font-family:inherit;font-size:15px;font-weight:700;padding:9px 14px;border:1px solid #d7dde5;border-radius:10px;background:#fff;color:#012a68;outline:none;min-width:250px;cursor:pointer\">\n              <sc-for list=\"{{ paysOptions }}\" as=\"o\" hint-placeholder-count=\"10\">\n                <option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap\">\n            <div style=\"display:flex;align-items:center;gap:10px\">\n              <span style=\"font-size:12px;color:#79828f\">Niveau de risque le plus élevé<\u002Fspan>\n              <span style=\"{{ paysRiskBadge }}\">{{ paysRiskLabel }}<\u002Fspan>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ onExportPays }}\" style=\"font-family:inherit;display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:#006bcd;background:#eef4ff;border:1px solid #d4e2fb;border-radius:9px;padding:8px 13px;cursor:pointer\" style-hover=\"background:#e2ecfd\">\n              <span style=\"font-size:13px\">🖨<\u002Fspan> Exporter cette fiche (PDF)\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ paysEmpty }}\">\n          <div style=\"background:#fff;border:1px dashed #d4dae2;border-radius:12px;padding:40px;text-align:center;color:#9aa4b2;font-size:13px\">Aucun pathogène surveillé signalé pour ce pays.<\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"background:#fff;border:1px solid #e6eaf0;border-radius:14px;box-shadow:0 1px 2px rgba(20,30,50,.04);overflow:hidden\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #eef1f5\">\n            <div style=\"font-size:15px;font-weight:700\">{{ paysCountry }}<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#9aa4b2\">{{ paysCount }} pathogène(s) signalé(s)<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:4px 0\">\n            <sc-for list=\"{{ paysList }}\" as=\"p\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;align-items:flex-start;gap:14px;padding:13px 18px;border-bottom:1px solid #f4f6f9\">\n                <span style=\"{{ p.badgeStyle }};min-width:104px;text-align:center\">{{ p.badgeLabel }}<\u002Fspan>\n                <div style=\"min-width:0;flex:1\">\n                  <div style=\"display:flex;align-items:center;gap:8px\">\n                    <span style=\"font-size:14px;font-weight:700;color:#012a68\">{{ p.name }}<\u002Fspan>\n                    <sc-if value=\"{{ p.hasTrend }}\"><span style=\"{{ p.trendStyle }}\" title=\"{{ p.trendTitle }}\">{{ p.trendArrow }}<\u002Fspan><\u002Fsc-if>\n                  <\u002Fdiv>\n                  <div style=\"font-size:11px;color:#8a93a1;margin-top:1px\">{{ p.group }}<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:#3c4757;margin-top:6px\">{{ p.stat }}<\u002Fdiv>\n                  <sc-if value=\"{{ p.hasSource }}\">\n                    <div style=\"font-size:10.5px;color:#9aa4b2;margin-top:2px\">Source : {{ p.source }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:14px;font-size:11px;color:#9aa4b2;line-height:1.5\">Niveaux issus de la matrice de surveillance (diffusion mondiale + Océan Indien) ; comptages affichés lorsqu'une source chiffrée existe pour le pays. Se met à jour avec les données du moteur.<\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ═══ ALERTES (fiches) ═══ -->\n      <sc-if value=\"{{ isAlertes }}\">\n      <div>\n        <div style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px\">\n          <div style=\"font-size:12.5px;color:#79828f;max-width:46ch\">Fiches cliniques des pathogènes suivis · en alerte et sous surveillance — référence pour la prise en charge<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n            <div style=\"position:relative;display:flex;align-items:center\">\n              <span style=\"position:absolute;left:11px;font-size:13px;color:#aab2bf;pointer-events:none\">⌕<\u002Fspan>\n              <input value=\"{{ fq }}\" sc-camel-on-input=\"{{ onFq }}\" placeholder=\"Rechercher un pathogène…\" style=\"font-family:inherit;font-size:13px;padding:8px 12px 8px 30px;border:1px solid #d7dde5;border-radius:9px;background:#fff;color:#012a68;width:210px;outline:none\">\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:3px;background:#eef1f5;border:1px solid #e3e8ef;border-radius:9px;padding:3px\">\n              <button style=\"{{ fsortNivStyle }}\" sc-camel-on-click=\"{{ onSortNiv }}\">Niveau<\u002Fbutton>\n              <button style=\"{{ fsortAzStyle }}\" sc-camel-on-click=\"{{ onSortAz }}\">A → Z<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ fichesEmpty }}\">\n          <div style=\"background:#fff;border:1px dashed #d4dae2;border-radius:12px;padding:40px;text-align:center;color:#9aa4b2;font-size:13px\">Aucun pathogène ne correspond à votre recherche.<\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px\">\n          <sc-for list=\"{{ fiches }}\" as=\"f\" hint-placeholder-count=\"6\">\n            <section style=\"background:#fff;border:1px solid #e6eaf0;border-radius:14px;box-shadow:0 1px 2px rgba(20,30,50,.04);overflow:hidden;display:flex;flex-direction:column\">\n              <div style=\"padding:14px 16px;border-bottom:1px solid #eef1f5;display:flex;align-items:flex-start;justify-content:space-between;gap:10px\">\n                <div>\n                  <div style=\"font-size:15px;font-weight:700;letter-spacing:-.01em\">{{ f.name }}<\u002Fdiv>\n                  <div style=\"font-size:11px;color:#8a93a1;margin-top:2px\">{{ f.group }}<\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"{{ f.badgeStyle }}\">{{ f.badgeLabel }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"padding:6px 16px 14px\">\n                <sc-for list=\"{{ f.chars }}\" as=\"c\" hint-placeholder-count=\"5\">\n                  <div style=\"display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #f4f6f9\">\n                    <span style=\"font-size:11px;font-weight:600;color:#79828f;min-width:118px;flex-shrink:0\">{{ c.k }}<\u002Fspan>\n                    <span style=\"font-size:12px;color:#3c4757;line-height:1.45\">{{ c.v }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <sc-if value=\"{{ f.hasLocal }}\">\n                  <div style=\"margin-top:12px;background:#eef4ff;border:1px solid #d4e2fb;border-radius:8px;padding:9px 11px;font-size:11.5px;color:#033e8c;line-height:1.5\"><span style=\"font-weight:700\">Situation La Réunion :<\u002Fspan> {{ f.localSit }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"margin-top:12px;background:#fdf6e3;border:1px solid #ecdca5;border-radius:8px;padding:9px 11px;font-size:11.5px;color:#8a6312;line-height:1.5\"><span style=\"font-weight:700\">Note :<\u002Fspan> {{ f.note }}<\u002Fdiv>\n                <sc-if value=\"{{ f.hasCat }}\" hint-placeholder-val=\"{{ f.hasCat }}\">\n                  <div sc-camel-on-click=\"{{ f.onToggleCat }}\" style=\"margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#eef4ff;border:1px solid #d6e3f5;border-radius:9px;padding:9px 12px;cursor:pointer\">\n                    <span style=\"font-size:11.5px;font-weight:700;color:#033e8c\">Conduite à tenir (COREB)<\u002Fspan>\n                    <sc-if value=\"{{ f.catClosed }}\" hint-placeholder-val=\"{{ f.catClosed }}\"><span style=\"font-size:11px;color:#033e8c\">Afficher ▾<\u002Fspan><\u002Fsc-if>\n                    <sc-if value=\"{{ f.catOpen }}\"><span style=\"font-size:11px;color:#033e8c\">Masquer ▴<\u002Fspan><\u002Fsc-if>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ f.catOpen }}\">\n                    <div style=\"margin-top:8px;border:1px solid #d6e3f5;border-radius:10px;overflow:hidden\">\n                      <div style=\"background:#eef4ff;padding:7px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap\">\n                        <sc-if value=\"{{ f.hasCorebLink }}\"><a href=\"{{ f.corebLink }}\" target=\"_blank\" rel=\"noreferrer\" style=\"font-size:11px;font-weight:700;color:#006bcd;text-decoration:none\">{{ f.corebLinkLabel }}<\u002Fa><\u002Fsc-if>\n                        <span style=\"font-size:10px;color:#7d93c0;margin-left:auto\">{{ f.catSrc }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"padding:4px 12px 8px\">\n                        <sc-for list=\"{{ f.cat }}\" as=\"c\" hint-placeholder-count=\"4\">\n                          <div style=\"padding:8px 0;border-bottom:1px solid #f1f4f8\">\n                            <div style=\"font-size:11px;font-weight:700;color:#033e8c;margin-bottom:2px\">{{ c.k }}<\u002Fdiv>\n                            <div style=\"font-size:11.5px;color:#3c4757;line-height:1.5\">{{ c.v }}<\u002Fdiv>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsection>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ═══ COURBES ═══ -->\n      <sc-if value=\"{{ isCourbes }}\">\n      <div>\n        <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap\">\n          <label style=\"font-size:13px;font-weight:600;color:#46505f\">Pathogène<\u002Flabel>\n          <sc-raw-select value=\"{{ courbeSel }}\" sc-camel-on-change=\"{{ onCourbeSel }}\" style=\"font-family:inherit;font-size:13px;padding:8px 12px;border:1px solid #d7dde5;border-radius:9px;background:#fff;color:#012a68;min-width:230px;cursor:pointer\">\n            <sc-for list=\"{{ courbeOptions }}\" as=\"o\" hint-placeholder-count=\"11\">\n              <option value=\"{{ o.id }}\">{{ o.name }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n          <div style=\"font-size:12px;color:#9aa4b2;margin-left:auto\">Série alimentée par les actualisations automatiques<\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasSeries }}\" hint-placeholder-val=\"{{ true }}\">\n        <section style=\"background:#fff;border:1px solid #e6eaf0;border-radius:14px;box-shadow:0 1px 2px rgba(20,30,50,.04);overflow:hidden\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid #eef1f5;flex-wrap:wrap;gap:8px\">\n            <div>\n              <div style=\"font-size:14px;font-weight:700\">{{ courbeName }} — courbe épidémique 2026<\u002Fdiv>\n              <div style=\"font-size:11px;color:#8a93a1;margin-top:2px\">{{ chart.metaText }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:16px;align-items:center\">\n              <div style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:12px;height:3px;background:#d4453f;border-radius:2px\"><\u002Fspan><span style=\"font-size:11px;color:#79828f\">Cas confirmés<\u002Fspan><\u002Fdiv>\n              <sc-if value=\"{{ chart.hasDec }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:12px;height:3px;background:#7f1d1d;border-radius:2px\"><\u002Fspan><span style=\"font-size:11px;color:#79828f\">Décès<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:20px 22px 12px;position:relative\">\n            <svg sc-camel-view-box=\"0 0 600 200\" style=\"width:100%;height:auto;display:block\" data-om-raster=\"\">\n              <sc-for list=\"{{ chart.gridLines }}\" as=\"g\" hint-placeholder-count=\"3\">\n                <line x1=\"40\" y1=\"{{ g.y }}\" x2=\"585\" y2=\"{{ g.y }}\" stroke=\"#eef1f5\" stroke-width=\"1\"><\u002Fline>\n              <\u002Fsc-for>\n              <path d=\"{{ chart.areaPath }}\" fill=\"#d4453f\" fill-opacity=\"0.08\" style=\"pointer-events:none\"><\u002Fpath>\n              <polyline points=\"{{ chart.casPolyline }}\" fill=\"none\" stroke=\"#d4453f\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\" style=\"pointer-events:none\"><\u002Fpolyline>\n              <sc-if value=\"{{ chart.hasDec }}\" hint-placeholder-val=\"{{ false }}\">\n                <polyline points=\"{{ chart.decPolyline }}\" fill=\"none\" stroke=\"#7f1d1d\" stroke-width=\"2\" stroke-dasharray=\"5 5\" stroke-linejoin=\"round\" stroke-linecap=\"round\" style=\"pointer-events:none\"><\u002Fpolyline>\n              <\u002Fsc-if>\n              <sc-for list=\"{{ chart.dots }}\" as=\"d\" hint-placeholder-count=\"5\">\n                <circle cx=\"{{ d.cx }}\" cy=\"{{ d.cy }}\" r=\"3.2\" fill=\"#d4453f\" stroke=\"#fff\" stroke-width=\"1.2\" style=\"pointer-events:none\"><\u002Fcircle>\n                <circle cx=\"{{ d.cx }}\" cy=\"{{ d.cy }}\" r=\"11\" fill=\"transparent\" style=\"cursor:pointer\" sc-camel-on-mouse-enter=\"{{ d.onEnter }}\" sc-camel-on-mouse-leave=\"{{ d.onLeave }}\"><\u002Fcircle>\n              <\u002Fsc-for>\n              <sc-for list=\"{{ chart.decDots }}\" as=\"dd\" hint-placeholder-count=\"5\">\n                <circle cx=\"{{ dd.cx }}\" cy=\"{{ dd.cy }}\" r=\"2.8\" fill=\"#7f1d1d\" stroke=\"#fff\" stroke-width=\"1.1\" style=\"pointer-events:none\"><\u002Fcircle>\n                <circle cx=\"{{ dd.cx }}\" cy=\"{{ dd.cy }}\" r=\"11\" fill=\"transparent\" style=\"cursor:pointer\" sc-camel-on-mouse-enter=\"{{ dd.onEnter }}\" sc-camel-on-mouse-leave=\"{{ dd.onLeave }}\"><\u002Fcircle>\n              <\u002Fsc-for>\n            <\u002Fsvg>\n            <!-- Libellés des axes en HTML superposé (les <text> SVG ne peuvent pas recevoir d'interpolation dynamique) -->\n            <sc-for list=\"{{ chart.gridLines }}\" as=\"g\" hint-placeholder-count=\"3\">\n              <div style=\"position:absolute;left:0;width:9%;top:{{ g.topPct }}%;transform:translateY(-50%);text-align:right;font-size:11px;font-weight:600;color:#6b7585;pointer-events:none\">{{ g.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-for list=\"{{ chart.xLabels }}\" as=\"xl\" hint-placeholder-count=\"5\">\n              <div style=\"position:absolute;left:{{ xl.leftPct }}%;top:97%;transform:translateX(-50%);font-size:11px;font-weight:600;color:#6b7585;pointer-events:none;white-space:nowrap\">{{ xl.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"position:absolute;left:{{ chart.lastLeftPct }}%;top:{{ chart.lastTopPct }}%;transform:translate(-100%,-50%);font-size:12px;font-weight:700;color:#d4453f;pointer-events:none;white-space:nowrap\">{{ chart.lastLabel }}<\u002Fdiv>\n            <sc-if value=\"{{ chart.hasDec }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"position:absolute;left:{{ chart.lastDecLeftPct }}%;top:{{ chart.lastDecTopPct }}%;transform:translate(-100%,-50%);font-size:12px;font-weight:700;color:#7f1d1d;pointer-events:none;white-space:nowrap\">{{ chart.lastDecLabel }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ chart.tipVisible }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"position:absolute;left:{{ chart.tipLeftPct }}%;top:{{ chart.tipTopPct }}%;transform:translate(-50%,-130%);background:#012a68;color:#fff;font-size:11.5px;font-weight:600;padding:6px 10px;border-radius:7px;white-space:nowrap;pointer-events:none;box-shadow:0 4px 12px rgba(20,30,50,.25);z-index:5\">{{ chart.tipText }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"padding:12px 18px;background:#fafbfc;border-top:1px solid #eef1f5;font-size:12px;color:#4a5360;line-height:1.55\">\n            <span style=\"font-weight:600\">Lecture :<\u002Fspan> {{ chart.lectureText }}\n          <\u002Fdiv>\n        <\u002Fsection>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ noSeries }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 20px;background:#fff;border:1px dashed #d4dae2;border-radius:14px\">\n            <div style=\"width:52px;height:52px;border-radius:13px;background:#eef2f7;display:flex;align-items:center;justify-content:center;font-size:22px;color:#8a93a1;margin-bottom:16px\">∿<\u002Fdiv>\n            <div style=\"font-size:15px;font-weight:700;margin-bottom:6px\">Pas encore de série temporelle pour {{ courbeName }}<\u002Fdiv>\n            <div style=\"font-size:13px;color:#79828f;max-width:430px;line-height:1.55\">Cette courbe se construit point par point au fil des actualisations automatiques. Dès qu'au moins deux relevés datés existent dans <code>donnees.json<\u002Fcode> (clé « epiSeries »), le graphique apparaît ici tout seul.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ═══ SIGNAL PRÉCOCE (ReliefWeb) ═══ -->\n      <sc-if value=\"{{ isSignal }}\">\n      <div>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:13px;margin-bottom:16px\">\n          <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:12px;padding:15px 16px\">\n            <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#5d6675;font-weight:700\">Alertes recensées<\u002Fdiv>\n            <div style=\"font-size:34px;font-weight:800;letter-spacing:-.03em;color:#012a68;font-variant-numeric:tabular-nums\">{{ rwTotal }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:12px;padding:15px 16px\">\n            <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#5d6675;font-weight:700\">En cours<\u002Fdiv>\n            <div style=\"font-size:34px;font-weight:800;letter-spacing:-.03em;color:#012a68;font-variant-numeric:tabular-nums\">{{ rwOngoing }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:12px;padding:15px 16px\">\n            <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#5d6675;font-weight:700\">Pays concernés<\u002Fdiv>\n            <div style=\"font-size:34px;font-weight:800;letter-spacing:-.03em;color:#012a68;font-variant-numeric:tabular-nums\">{{ rwCountries }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:12px;padding:15px 16px\">\n            <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#5d6675;font-weight:700\">Plus récente<\u002Fdiv>\n            <div style=\"font-size:19px;font-weight:800;color:#012a68;margin-top:8px\">{{ rwLatest }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px\">\n          <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n            <sc-for list=\"{{ rwFilters }}\" as=\"f\" hint-placeholder-count=\"2\">\n              <button sc-camel-on-click=\"{{ f.onClick }}\" style=\"{{ f.style }}\">{{ f.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <span style=\"font-size:11px;color:#5d6675\">{{ rwFetchedLabel }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ rwEmpty }}\">\n          <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:14px;padding:28px 18px;text-align:center;color:#5d6675;font-size:13px\">Aucune alerte épidémie active recensée dans la zone de veille.<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:13px;align-items:start\">\n          <sc-for list=\"{{ rwGroups }}\" as=\"g\" hint-placeholder-count=\"4\">\n            <section style=\"background:#fff;border:1px solid #dbe1ea;border-radius:14px;box-shadow:0 1px 2px rgba(20,30,50,.05);overflow:hidden\">\n              <div style=\"padding:11px 16px;border-bottom:1px solid #eef1f5;background:#f6f8fb;display:flex;align-items:center;justify-content:space-between;gap:10px\">\n                <span style=\"font-size:13.5px;font-weight:800;color:#012a68\">{{ g.country }}<\u002Fspan>\n                <span style=\"font-size:10.5px;font-weight:700;color:#5d6675\">{{ g.countLabel }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"padding:2px 16px 6px\">\n                <sc-for list=\"{{ g.items }}\" as=\"a\" hint-placeholder-count=\"2\">\n                  <a href=\"{{ a.url }}\" target=\"_blank\" rel=\"noreferrer\" style=\"display:flex;gap:11px;padding:11px 0;border-bottom:1px solid #f1f3f6;text-decoration:none;color:inherit\" style-hover=\"background:#fafbfd\">\n                    <span style=\"width:8px;height:8px;border-radius:50%;background:{{ a.dot }};margin-top:6px;flex-shrink:0\"><\u002Fspan>\n                    <div style=\"min-width:0;flex:1\">\n                      <div style=\"font-size:13px;font-weight:600;color:#012a68;line-height:1.4\">{{ a.name }}<\u002Fdiv>\n                      <div style=\"display:flex;gap:8px;align-items:center;margin-top:4px;flex-wrap:wrap\">\n                        <span style=\"{{ a.statusStyle }}\">{{ a.statusLabel }}<\u002Fspan>\n                        <span style=\"font-size:11px;color:#5d6675\">{{ a.dateLabel }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                    <span style=\"font-size:11px;color:#006bcd;font-weight:700;flex-shrink:0;margin-top:2px\">↗<\u002Fspan>\n                  <\u002Fa>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsection>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:16px;font-size:11.5px;color:#5d6675;line-height:1.55\">Signal précoce issu de l'API ReliefWeb (OCHA) : épidémies déclarées dans la zone de veille Océan Indien &amp; Afrique de l'Est, actualisées chaque jour par le moteur. Ces alertes ne sont pas des bilans chiffrés : chaque lien ouvre la fiche ReliefWeb correspondante.<\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ═══ SOURCES & ACTUALISATIONS ═══ -->\n      <sc-if value=\"{{ isSources }}\">\n      <div>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:22px\">\n          <div style=\"background:#fff;border:1px solid #e6eaf0;border-radius:12px;padding:17px 18px;box-shadow:0 1px 2px rgba(20,30,50,.04)\">\n            <div style=\"font-size:11.5px;color:#79828f;font-weight:500\">Dernière actualisation<\u002Fdiv>\n            <div style=\"font-size:21px;font-weight:800;letter-spacing:-.01em;margin-top:9px\">{{ lastUpdShort }}<\u002Fdiv>\n            <div style=\"font-size:11px;color:#9aa4b2;margin-top:5px\">{{ lastUpdKind }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #e6eaf0;border-radius:12px;padding:17px 18px;box-shadow:0 1px 2px rgba(20,30,50,.04)\">\n            <div style=\"font-size:11.5px;color:#79828f;font-weight:500\">Cadence<\u002Fdiv>\n            <div style=\"font-size:21px;font-weight:800;letter-spacing:-.01em;margin-top:9px\">1×/jour<\u002Fdiv>\n            <div style=\"font-size:11px;color:#9aa4b2;margin-top:5px\">{{ cadenceNote }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #e6eaf0;border-radius:12px;padding:17px 18px;box-shadow:0 1px 2px rgba(20,30,50,.04)\">\n            <div style=\"font-size:11.5px;color:#79828f;font-weight:500\">Sources suivies<\u002Fdiv>\n            <div class=\"num\" style=\"font-size:21px;font-weight:800;letter-spacing:-.01em;margin-top:9px\">{{ sourcesTotal }}<\u002Fdiv>\n            <div style=\"font-size:11px;color:#9aa4b2;margin-top:5px\">{{ sourcesBreakdown }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasCoreb }}\" hint-placeholder-val=\"{{ true }}\">\n        <section style=\"margin-bottom:16px;background:#fff;border:1px solid #cfdcf5;border-radius:14px;box-shadow:0 1px 2px rgba(20,30,50,.05);overflow:hidden\">\n          <div style=\"padding:14px 18px;border-bottom:1px solid #e3ebfa;background:#f3f7ff;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap\">\n            <div style=\"display:flex;align-items:center;gap:9px;flex-wrap:wrap\">\n              <span style=\"font-size:14px;font-weight:700;color:#012a68\">Dernières veilles COREB<\u002Fspan>\n              <span style=\"background:#006bcd;color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:.04em\">SOURCE PRIORITAIRE<\u002Fspan>\n            <\u002Fdiv>\n            <a href=\"{{ corebPage }}\" target=\"_blank\" rel=\"noreferrer\" style=\"font-size:12px;font-weight:600;color:#006bcd;text-decoration:none\">Toutes les veilles ↗<\u002Fa>\n          <\u002Fdiv>\n          <div style=\"padding:14px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px\">\n            <sc-for list=\"{{ corebRecent }}\" as=\"v\" hint-placeholder-count=\"3\">\n              <a href=\"{{ v.url }}\" target=\"_blank\" rel=\"noreferrer\" style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border:1px solid #e3e8ef;border-radius:9px;text-decoration:none;color:#012a68;background:#fff\" style-hover=\"border-color:#006bcd;background:#f7faff\">\n                <div style=\"min-width:0\">\n                  <div style=\"font-size:13px;font-weight:700\">{{ v.label }}<\u002Fdiv>\n                  <div style=\"font-size:11px;color:#5d6675;margin-top:2px\">{{ v.tag }}<\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font-size:11px;font-weight:700;color:#006bcd;flex-shrink:0\">PDF ↗<\u002Fspan>\n              <\u002Fa>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hasCorebSignals }}\">\n            <div style=\"padding:0 18px 14px\">\n              <div style=\"font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#5d6675;margin-bottom:8px\">{{ corebSignalsTitle }}<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px\">\n                <sc-for list=\"{{ corebSignals }}\" as=\"sg\" hint-placeholder-count=\"4\">\n                  <div style=\"border:1px solid #eef1f5;border-radius:9px;padding:10px 12px;background:#fafbfc\">\n                    <div style=\"font-size:12.5px;font-weight:700;color:#012a68;margin-bottom:5px\">{{ sg.title }}<\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:3px\">\n                      <sc-for list=\"{{ sg.countries }}\" as=\"c\" hint-placeholder-count=\"2\">\n                        <div style=\"display:flex;justify-content:space-between;gap:10px;font-size:11.5px\">\n                          <span style=\"color:#3c4757\">{{ c.name }}<\u002Fspan>\n                          <span style=\"{{ c.figStyle }};text-align:right\">{{ c.figs }}<\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"padding:0 18px 13px;font-size:11.5px;color:#5d6675;line-height:1.5\">{{ corebNote }}<\u002Fdiv>\n        <\u002Fsection>\n        <\u002Fsc-if>\n\n        <div style=\"display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start\">\n          <!-- Sources -->\n          <section style=\"background:#fff;border:1px solid #e6eaf0;border-radius:14px;box-shadow:0 1px 2px rgba(20,30,50,.04);overflow:hidden\">\n            <div style=\"padding:15px 18px;border-bottom:1px solid #eef1f5;font-size:14px;font-weight:700\">Sources de référence<\u002Fdiv>\n            <div>\n              <sc-for list=\"{{ sources }}\" as=\"s\" hint-placeholder-count=\"8\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 18px;border-bottom:1px solid #f4f6f9\">\n                  <div style=\"min-width:0\">\n                    <div style=\"display:flex;align-items:center;gap:7px;flex-wrap:wrap\">\n                      <sc-if value=\"{{ s.hasUrl }}\">\n                        <a href=\"{{ s.url }}\" target=\"_blank\" rel=\"noreferrer\" style=\"font-size:13px;font-weight:600;color:#012a68;text-decoration:none;display:inline-flex;align-items:center;gap:5px\" style-hover=\"color:#006bcd\">{{ s.name }}<span style=\"font-size:10px;color:#9aa4b2\">↗<\u002Fspan><\u002Fa>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ s.noUrl }}\"><span style=\"font-size:13px;font-weight:600;color:#012a68\">{{ s.name }}<\u002Fspan><\u002Fsc-if>\n                      <span style=\"{{ s.kindTagStyle }};font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px\">{{ s.kindTagLabel }}<\u002Fspan>\n                      <sc-if value=\"{{ s.hasRun }}\"><span style=\"{{ s.runStyle }};font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px;letter-spacing:.02em\">{{ s.runLabel }}<\u002Fspan><\u002Fsc-if>\n                    <\u002Fdiv>\n                    <div style=\"font-size:11px;color:#8a93a1;margin-top:2px\">{{ s.scope }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <span style=\"{{ s.freshPillStyle }}\"><span style=\"width:7px;height:7px;border-radius:50%;background:{{ s.freshDot }}\"><\u002Fspan>{{ s.freshLabel }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"padding:11px 18px;background:#fafbfc;border-top:1px solid #eef1f5;font-size:11px;color:#9aa4b2;line-height:1.5\">Les chiffres affichés dans l'outil renvoient toujours à l'une de ces sources, avec la date du bilan. Aucune donnée n'est inventée.<\u002Fdiv>\n          <\u002Fsection>\n\n          <!-- Journal d'actualisation -->\n          <section style=\"background:#fff;border:1px solid #e6eaf0;border-radius:14px;box-shadow:0 1px 2px rgba(20,30,50,.04);overflow:hidden\">\n            <div style=\"padding:15px 18px;border-bottom:1px solid #eef1f5;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap\">\n              <span style=\"display:flex;flex-direction:column;gap:2px\">\n                <span style=\"font-size:14px;font-weight:700\">Journal d'actualisation<\u002Fspan>\n                <span style=\"font-size:11px;color:#5d6675\">Dernière tentative de chaque source<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"display:flex;align-items:center;gap:12px;font-size:10px;color:#79828f\">\n                <span style=\"display:inline-flex;align-items:center;gap:4px\"><span style=\"width:7px;height:7px;border-radius:50%;background:#2c7a44\"><\u002Fspan>mise à jour<\u002Fspan>\n                <span style=\"display:inline-flex;align-items:center;gap:4px\"><span style=\"width:7px;height:7px;border-radius:50%;background:#9aa4b2\"><\u002Fspan>rien de neuf<\u002Fspan>\n                <span style=\"display:inline-flex;align-items:center;gap:4px\"><span style=\"width:7px;height:7px;border-radius:50%;background:#d4453f\"><\u002Fspan>échec extraction<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"padding:6px 18px 14px\">\n              <sc-for list=\"{{ updates }}\" as=\"u\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;gap:11px;padding:12px 0;border-bottom:1px solid #f4f6f9\">\n                  <span style=\"width:8px;height:8px;border-radius:50%;background:{{ u.dot }};margin-top:5px;flex-shrink:0\"><\u002Fspan>\n                  <div style=\"min-width:0\">\n                    <div style=\"display:flex;align-items:center;gap:7px;margin-bottom:3px;flex-wrap:wrap\">\n                      <span style=\"font-size:11px;font-weight:700;color:#012a68\">{{ u.date }}<\u002Fspan>\n                      <span style=\"{{ u.tagStyle }};font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px\">{{ u.tagLabel }}<\u002Fspan>\n                      <span style=\"{{ u.statusStyle }};font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px;letter-spacing:.02em\">{{ u.statusLabel }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size:12px;color:#3c4757;line-height:1.45\">{{ u.what }}<\u002Fdiv>\n                    <div style=\"font-size:10.5px;color:#9aa4b2;margin-top:3px\">{{ u.src }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fdiv>\n        <div style=\"margin-top:16px;background:#eef4ff;border:1px solid #d4e2fb;border-radius:11px;padding:13px 16px;font-size:12px;color:#3a4f7a;line-height:1.55\"><span style=\"font-weight:700\">En service : <\u002Fspan>le moteur d'actualisation interroge automatiquement, chaque jour à 6h, l'OMS (API), l'ECDC et la veille COREB pour <strong>Ebola Bundibugyo<\u002Fstrong> et les FHV. CDC, ESCMID Epi Alert et Africa CDC restent listés en sources complémentaires, avec lien direct, mais ne sont plus interrogés automatiquement (accès refusé ou format trop instable). Pour <strong>La Réunion<\u002Fstrong>, dengue et chikungunya viennent de l'API Odissé (Santé publique France) ; le bulletin hebdomadaire SpF Océan Indien est lu automatiquement — page <em>et PDF joint<\u002Fem>, où vivent désormais les chiffres — pour en extraire <strong>leptospirose<\u002Fstrong> et <strong>Mpox<\u002Fstrong>, avec la page mpox de l'ARS La Réunion en repli. La veille COREB alimente aussi les autres FHV (FHCC, Lassa…) : ses chiffres par pays sont repris automatiquement. Les alertes de la zone viennent de l'API ReliefWeb (onglet Signal précoce). Un chiffre n'est publié que s'il est plus récent que celui déjà affiché, et une valeur aberrante est rejetée. À chaque run, les chiffres collectés sont propagés vers l'Accueil (indicateurs), les Alertes, la Synthèse, les Courbes et le Bulletin du jour. Les <em>niveaux de gravité<\u002Fem> des cartes sont recalculés automatiquement, en citant leur référentiel : d'abord le niveau de risque national du dernier bulletin DON de l'OMS sur le pays (moins de 90 jours), puis, pour la dengue et le chikungunya à La Réunion, la phase ORSEC arboviroses citée dans le bulletin SpF ; à défaut, la règle REB RUN : Urgence si nouveaux décès sur 30 jours, Alerte si nouveaux cas sur 30 jours, Vigilance entre 31 et 60 jours, Surveillance au-delà ou si l'épidémie est terminée. Pour La Réunion et Mayotte, qui publient des cumuls annuels, c'est l'ampleur de la hausse sur 30 jours qui compte (Alerte dès 15 % du cumul ou 20 cas ; seuls les cas autochtones pour le mpox). Chaque changement de niveau est tracé dans le journal. Les niveaux sans relevé chiffré (posture de vigilance, estimations) et le choléra restent curés manuellement. Le bouton ↻ de la barre latérale relit simplement la dernière publication — il ne déclenche pas une nouvelle vérification web (ce n'est pas possible depuis une page statique).<\u002Fdiv>\n\n        <section style=\"margin-top:16px;background:#fff;border:1px solid #e6eaf0;border-radius:14px;box-shadow:0 1px 2px rgba(20,30,50,.04);overflow:hid
