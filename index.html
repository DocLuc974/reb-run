den\">\n          <div style=\"padding:15px 18px;border-bottom:1px solid #eef1f5\">\n            <span style=\"font-size:14px;font-weight:700\">Mentions légales &amp; réutilisation<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:16px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px\">\n            <div>\n              <div style=\"font-size:10px;font-weight:700;letter-spacing:.06em;color:#9aa4b2;margin-bottom:6px\">ÉDITEUR<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#3c4757;line-height:1.55\">Service de maladies infectieuses et tropicales (SMIT) — CHU de La Réunion.<br><span style=\"font-weight:600;color:#012a68\">Équipe REB RUN<\u002Fspan>, dans le cadre de la mission de veille du risque épidémique et biologique.<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:10px;font-weight:700;letter-spacing:.06em;color:#9aa4b2;margin-bottom:6px\">NATURE DE L'OUTIL<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#3c4757;line-height:1.55\">Outil interne d'aide à la veille épidémiologique. Il agrège des données publiques et ne se substitue ni aux sources officielles, ni à l'avis médical, ni à une décision de conduite à tenir pour un patient donné. Ce n'est pas un dispositif médical.<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:10px;font-weight:700;letter-spacing:.06em;color:#9aa4b2;margin-bottom:6px\">DONNÉES &amp; LICENCES<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#3c4757;line-height:1.55\">Seuls des indicateurs chiffrés et des intitulés d'alertes sont extraits, jamais le contenu rédactionnel des sources. Santé publique France / Odissé : Licence Ouverte (Etalab). OMS, ECDC, CDC, ReliefWeb : réutilisation avec attribution, hors usage commercial. Chaque chiffre affiché porte sa source et sa date ; tous les liens d'origine sont donnés ci-dessus.<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:10px;font-weight:700;letter-spacing:.06em;color:#9aa4b2;margin-bottom:6px\">DONNÉES PERSONNELLES<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#3c4757;line-height:1.55\">Aucune. L'outil ne traite que des agrégats publics, ne collecte rien sur ses utilisateurs et n'utilise pas de traceur.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:11px 18px;background:#fafbfc;border-top:1px solid #eef1f5;font-size:11px;color:#9aa4b2;line-height:1.5\">Une erreur, une source à ajouter ou un chiffre à corriger : signalez-le à l'équipe REB RUN — SMIT, CHU de La Réunion.<\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ═══ AUTRES VUES (placeholder) ═══ -->\n      <sc-if value=\"{{ isOther }}\">\n      <div style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:70px 20px;background:#fff;border:1px dashed #d4dae2;border-radius:14px\">\n        <div style=\"width:52px;height:52px;border-radius:13px;background:#eef2f7;display:flex;align-items:center;justify-content:center;font-size:22px;color:#8a93a1;margin-bottom:16px\">{{ otherIcon }}<\u002Fdiv>\n        <div style=\"font-size:17px;font-weight:700;margin-bottom:6px\">{{ pageTitle }}<\u002Fdiv>\n        <div style=\"font-size:13px;color:#79828f;max-width:430px;line-height:1.55\">Cette vue est déjà construite dans ton prototype (carte D3, heatmap, courbes, synthèse, journal). On la reprend telle quelle dans la piste B — seul l'habillage change pour coller au tableau de bord.<\u002Fdiv>\n        <div style=\"margin-top:18px;font-size:12px;color:#006bcd;font-weight:600;background:#eef4ff;border:1px solid #d4e2fb;padding:7px 14px;border-radius:8px\">Maquette à détailler si on valide la piste B<\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n\n    <!-- ═══ FICHE PAYS (clic carte) ═══ -->\n    <sc-if value=\"{{ hasDetail }}\">\n    <div sc-camel-on-click=\"{{ onCloseDetail }}\" style=\"position:absolute;inset:0;background:rgba(20,30,50,.28);z-index:40\"><\u002Fdiv>\n    <div style=\"position:absolute;top:0;right:0;height:100%;width:380px;max-width:90vw;background:#fff;box-shadow:-8px 0 30px rgba(20,30,50,.16);z-index:41;display:flex;flex-direction:column\">\n      <div style=\"padding:16px 18px;border-bottom:1px solid #eef1f5;display:flex;align-items:flex-start;justify-content:space-between;gap:10px\">\n        <div>\n          <div style=\"font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#9aa4b2;margin-bottom:4px\">{{ detail.scopeLabel }}<\u002Fdiv>\n          <div style=\"font-size:18px;font-weight:800;letter-spacing:-.01em;color:#012a68\">{{ detail.country }}<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#79828f;margin-top:2px\">{{ detail.patho }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{ onCloseDetail }}\" style=\"width:30px;height:30px;border-radius:8px;background:#f1f4f8;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#79828f;font-size:15px;flex-shrink:0\">✕<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:16px 18px;overflow-y:auto;flex:1\">\n        <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap\">\n          <span style=\"{{ detail.badgeStyle }}\">{{ detail.badgeLabel }}<\u002Fspan>\n          <span style=\"{{ detail.trendStyle }}\">{{ detail.trendLabel }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"background:#f8fafc;border:1px solid #eef1f5;border-radius:11px;padding:14px;margin-bottom:14px\">\n          <div style=\"font-size:11px;font-weight:700;color:#79828f;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px\">Situation épidémiologique<\u002Fdiv>\n          <sc-if value=\"{{ detail.notImported }}\" hint-placeholder-val=\"{{ detail.notImported }}\">\n            <div style=\"display:flex;gap:10px\">\n              <div style=\"flex:1\">\n                <div class=\"num\" style=\"font-size:24px;font-weight:800;color:#b32525;line-height:1\">{{ detail.cas }}<\u002Fdiv>\n                <div style=\"font-size:10.5px;color:#9aa4b2;margin-top:3px\">cas<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1\">\n                <div class=\"num\" style=\"font-size:24px;font-weight:800;color:#7a1f1f;line-height:1\">{{ detail.dec }}<\u002Fdiv>\n                <div style=\"font-size:10.5px;color:#9aa4b2;margin-top:3px\">décès<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:11px;color:#79828f;margin-top:12px;line-height:1.5\">{{ detail.meta }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ detail.isImported }}\" hint-placeholder-val=\"{{ detail.isImported }}\">\n            <div style=\"display:flex;align-items:center;gap:10px\">\n              <span style=\"width:30px;height:30px;border-radius:50%;border:2px solid #d8a72b;display:flex;align-items:center;justify-content:center;flex-shrink:0\"><span style=\"width:8px;height:8px;border-radius:50%;background:#d8a72b\"><\u002Fspan><\u002Fspan>\n              <div>\n                <div style=\"font-size:18px;font-weight:800;color:#8a6312;line-height:1.1\"><span class=\"num\">{{ detail.importedN }}<\u002Fspan> cas importé<\u002Fdiv>\n                <div style=\"font-size:10.5px;color:#9aa4b2;margin-top:2px\">aucune circulation locale<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:11px;color:#79828f;margin-top:12px;line-height:1.5\">{{ detail.importedMeta }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"font-size:11px;font-weight:700;color:#79828f;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px\">Caractéristiques<\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #eef1f5;border-radius:11px;overflow:hidden;margin-bottom:14px\">\n          <sc-for list=\"{{ detail.chars }}\" as=\"c\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid #f4f6f9\">\n              <span style=\"font-size:11px;font-weight:600;color:#79828f;min-width:96px;flex-shrink:0\">{{ c.k }}<\u002Fspan>\n              <span style=\"font-size:11.5px;color:#3c4757;line-height:1.45\">{{ c.v }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"background:#fdf6e3;border:1px solid #ecdca5;border-radius:10px;padding:11px 13px;font-size:11.5px;color:#8a6312;line-height:1.55\"><span style=\"font-weight:700\">Note : <\u002Fspan>{{ detail.note }}<\u002Fdiv>\n        <sc-if value=\"{{ detail.hasCat }}\" hint-placeholder-val=\"{{ detail.hasCat }}\">\n          <div sc-camel-on-click=\"{{ detail.onToggleCat }}\" style=\"margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#eef4ff;border:1px solid #d6e3f5;border-radius:9px;padding:10px 13px;cursor:pointer\">\n            <span style=\"font-size:11.5px;font-weight:700;color:#033e8c\">Conduite à tenir (COREB)<\u002Fspan>\n            <sc-if value=\"{{ detail.catClosed }}\" hint-placeholder-val=\"{{ detail.catClosed }}\"><span style=\"font-size:11px;color:#033e8c\">Afficher ▾<\u002Fspan><\u002Fsc-if>\n            <sc-if value=\"{{ detail.catOpen }}\"><span style=\"font-size:11px;color:#033e8c\">Masquer ▴<\u002Fspan><\u002Fsc-if>\n          <\u002Fdiv>\n          <sc-if value=\"{{ detail.catOpen }}\">\n            <div style=\"margin-top:8px;border:1px solid #d6e3f5;border-radius:11px;overflow:hidden\">\n              <div style=\"background:#eef4ff;padding:7px 13px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap\">\n                <sc-if value=\"{{ detail.hasCorebLink }}\"><a href=\"{{ detail.corebLink }}\" target=\"_blank\" rel=\"noreferrer\" style=\"font-size:11px;font-weight:700;color:#006bcd;text-decoration:none\">{{ detail.corebLinkLabel }}<\u002Fa><\u002Fsc-if>\n                <span style=\"font-size:10px;color:#7d93c0;margin-left:auto\">{{ detail.catSrc }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"padding:4px 13px 9px\">\n                <sc-for list=\"{{ detail.cat }}\" as=\"c\" hint-placeholder-count=\"4\">\n                  <div style=\"padding:8px 0;border-bottom:1px solid #f1f4f8\">\n                    <div style=\"font-size:11px;font-weight:700;color:#033e8c;margin-bottom:2px\">{{ c.k }}<\u002Fdiv>\n                    <div style=\"font-size:11.5px;color:#3c4757;line-height:1.5\">{{ c.v }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n<\u002Fdiv>\n\n<!-- ═══ BULLETIN IMPRIMABLE (PDF) ═══ -->\n<div id=\"bulletin\" style=\"font-family:'Public Sans',system-ui,sans-serif;color:#012a68;background:#fff;padding:0\">\n  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:2px solid #012a68;padding-bottom:14px;margin-bottom:20px\">\n    <div style=\"display:flex;align-items:center;gap:12px\">\n      <img src=\"8bf8a382-6b52-4cfe-a35b-f364341081d3\" alt=\"REB RUN — CHU La Réunion\" style=\"height:44px;width:auto;object-fit:contain\">\n      <div style=\"border-left:1px solid #e6eaf0;padding-left:12px\">\n        <div style=\"font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#79828f\">REB RUN — La Réunion · COREB<\u002Fdiv>\n        <div style=\"font-size:18px;font-weight:800;letter-spacing:-.01em\">Bulletin de veille REB — Océan Indien<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"text-align:right;font-size:11px;color:#79828f;line-height:1.6\">{{ bulletin.dateLong }}<br><span style=\"color:#b32525;font-weight:700\">Risque global : {{ kpiNiveau }}<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"font-size:13px;font-weight:700;color:#46505f;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px\">Foyers actifs &amp; pathogènes suivis<\u002Fdiv>\n  <div style=\"font-size:12px;margin-bottom:20px\">\n    <div style=\"display:grid;grid-template-columns:160px 110px 1fr 160px;background:#f6f8fa\">\n      <div style=\"text-align:left;padding:8px 10px;border-bottom:1.5px solid #e6eaf0;font-weight:700;color:#46505f\">Pathogène<\u002Fdiv>\n      <div style=\"text-align:left;padding:8px 10px;border-bottom:1.5px solid #e6eaf0;font-weight:700;color:#46505f\">Niveau<\u002Fdiv>\n      <div style=\"text-align:left;padding:8px 10px;border-bottom:1.5px solid #e6eaf0;font-weight:700;color:#46505f\">Zones &amp; chiffres<\u002Fdiv>\n      <div style=\"text-align:left;padding:8px 10px;border-bottom:1.5px solid #e6eaf0;font-weight:700;color:#46505f\">Période<\u002Fdiv>\n    <\u002Fdiv>\n    <sc-for list=\"{{ alerts }}\" as=\"a\" hint-placeholder-count=\"7\">\n      <div style=\"display:grid;grid-template-columns:160px 110px 1fr 160px;break-inside:avoid\">\n        <div style=\"padding:8px 10px;border-bottom:1px solid #f1f4f8;font-weight:700;color:#012a68\">{{ a.name }}<div style=\"font-size:10px;font-weight:400;color:#8a93a1;margin-top:2px\">{{ a.group }}<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:8px 10px;border-bottom:1px solid #f1f4f8\"><span style=\"{{ a.badgeStyle }}\">{{ a.badgeLabel }}<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:8px 10px;border-bottom:1px solid #f1f4f8\">\n          <sc-for list=\"{{ a.zones }}\" as=\"z\" hint-placeholder-count=\"2\">\n            <div style=\"font-size:11.5px;color:#3c4757;margin-bottom:2px\"><span style=\"font-weight:600\">{{ z.zone }}<\u002Fspan> · {{ z.stat }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"padding:8px 10px;border-bottom:1px solid #f1f4f8;font-size:10.5px;color:#79828f\">{{ a.period }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"font-size:13px;font-weight:700;color:#46505f;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px\">Faits marquants<\u002Fdiv>\n  <div style=\"margin-bottom:20px\">\n    <sc-for list=\"{{ bulletinFacts }}\" as=\"j\" hint-placeholder-count=\"3\">\n      <div style=\"padding:9px 0;border-bottom:1px solid #f1f4f8;break-inside:avoid\">\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:3px\">\n          <span style=\"width:8px;height:8px;border-radius:50%;background:{{ j.dot }};flex-shrink:0\"><\u002Fspan>\n          <span style=\"font-size:12px;font-weight:700\">{{ j.path }}<\u002Fspan>\n          <span style=\"font-size:10px;color:#9aa4b2\">{{ j.meta }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:11.5px;color:#3c4757;line-height:1.5;padding-left:16px\">{{ j.text }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"font-size:10px;color:#9aa4b2;line-height:1.6;border-top:1px solid #eef1f5;padding-top:12px\">\n    Sources : veille épidémiologique REB de la COREB, OMS (Disease Outbreak News), ECDC, Santé publique France (bulletin Océan Indien, Odissé), ARS La Réunion, ReliefWeb (OCHA). Chiffres indicatifs, arrêtés à la date propre à chaque relevé. Outil d'aide à la veille, ne se substitue pas aux sources officielles. Document interne — équipe REB RUN, SMIT, CHU de La Réunion.\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══ FICHE PAYS IMPRIMABLE (PDF) ═══ -->\n<div id=\"bulletin-pays\" style=\"font-family:'Public Sans',system-ui,sans-serif;color:#012a68;background:#fff\">\n  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:2px solid #012a68;padding-bottom:14px;margin-bottom:20px\">\n    <div style=\"display:flex;align-items:center;gap:12px\">\n      <img src=\"8bf8a382-6b52-4cfe-a35b-f364341081d3\" alt=\"REB RUN — CHU La Réunion\" style=\"height:44px;width:auto;object-fit:contain\">\n      <div style=\"border-left:1px solid #e6eaf0;padding-left:12px\">\n        <div style=\"font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#79828f\">REB RUN — Fiche pays<\u002Fdiv>\n        <div style=\"font-size:18px;font-weight:800;letter-spacing:-.01em\">{{ paysCountry }} — situation épidémiologique<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"text-align:right;font-size:11px;color:#79828f;line-height:1.6\">Risque le plus élevé<br><span style=\"{{ paysRiskBadge }}\">{{ paysRiskLabel }}<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-size:12px;margin-bottom:20px\">\n    <div style=\"display:grid;grid-template-columns:190px 120px 1fr;background:#f6f8fa\">\n      <div style=\"padding:8px 10px;border-bottom:1.5px solid #e6eaf0;font-weight:700;color:#46505f\">Pathogène<\u002Fdiv>\n      <div style=\"padding:8px 10px;border-bottom:1.5px solid #e6eaf0;font-weight:700;color:#46505f\">Niveau<\u002Fdiv>\n      <div style=\"padding:8px 10px;border-bottom:1.5px solid #e6eaf0;font-weight:700;color:#46505f\">Chiffres &amp; source<\u002Fdiv>\n    <\u002Fdiv>\n    <sc-for list=\"{{ paysList }}\" as=\"p\" hint-placeholder-count=\"5\">\n      <div style=\"display:grid;grid-template-columns:190px 120px 1fr;break-inside:avoid\">\n        <div style=\"padding:8px 10px;border-bottom:1px solid #f1f4f8;font-weight:700;color:#012a68\">{{ p.name }}<div style=\"font-size:10px;font-weight:400;color:#8a93a1;margin-top:2px\">{{ p.group }}<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:8px 10px;border-bottom:1px solid #f1f4f8\"><span style=\"{{ p.badgeStyle }}\">{{ p.badgeLabel }}<\u002Fspan> <span style=\"{{ p.trendStyle }}\">{{ p.trendArrow }}<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:8px 10px;border-bottom:1px solid #f1f4f8;font-size:11.5px;color:#3c4757\">{{ p.stat }}<sc-if value=\"{{ p.hasSource }}\"><div style=\"font-size:10px;color:#9aa4b2;margin-top:2px\">Source : {{ p.source }}<\u002Fdiv><\u002Fsc-if><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"font-size:10px;color:#9aa4b2;line-height:1.6;border-top:1px solid #eef1f5;padding-top:12px\">\n    Niveaux issus de la matrice de surveillance REB (diffusion mondiale + Océan Indien). Chiffres arrêtés à la date des derniers bilans disponibles. Tendance ↑/↓/→ selon le dernier relevé. Document interne REB RUN — service d'infectiologie / COREB.\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { view: 'accueil', refreshState: 'idle' };\n\n  componentDidMount() {\n    this._onResize = () => { this._mapKey = null; this.scheduleDraw(); };\n    window.addEventListener('resize', this._onResize);\n    this.scheduleDraw();\n    // Étape 2 : charger les chiffres depuis le fichier de données externe (repli sur valeurs intégrées si absent)\n    this.loadData();\n  }\n  componentWillUnmount() {\n    window.removeEventListener('resize', this._onResize);\n  }\n  componentDidUpdate() { this.scheduleDraw(); }\n\n  // Recharge donnees.json — c'est le fichier que le moteur d'actualisation (GitHub Actions,\n  // 1×/jour) tient à jour. Ce bouton ne relance PAS une vérification web en direct (impossible\n  // depuis une page statique, et bloqué par CORS pour plusieurs sources) — il relit simplement\n  // la dernière version publiée, utile si la page est restée ouverte depuis avant le run du jour.\n  loadData(manual) {\n    if (manual) this.setState({ refreshState: 'loading' });\n    return fetch('donnees.json', { cache: 'no-store' })\n      .then(r => r.ok ? r.json() : null)\n      .then(d => {\n        if (d) this.setState({ data: d, refreshState: manual ? 'done' : 'idle' });\n        else if (manual) this.setState({ refreshState: 'error' });\n        if (manual) setTimeout(() => this.setState({ refreshState: 'idle' }), 2500);\n      })\n      .catch(() => { if (manual) { this.setState({ refreshState: 'error' }); setTimeout(() => this.setState({ refreshState: 'idle' }), 2500); } });\n  }\n\n  scheduleDraw() {\n    clearTimeout(this._drawT);\n    this._drawT = setTimeout(() => this.drawMap(), 60);\n  }\n\n  onPick(name, mode, isIsland) {\n    this.setState({ sel: { name, mode, isIsland } });\n  }\n\n  async waitLibs() {\n    for (let i = 0; i < 120; i++) {\n      if (window.d3 && window.topojson) return true;\n      await new Promise(r => setTimeout(r, 80));\n    }\n    return !!(window.d3 && window.topojson);\n  }\n\n  async ensureTopo() {\n    if (this._topoFeat) return this._topoFeat;\n    if (this._topoLoading) return this._topoLoading;\n    this._topoLoading = (async () => {\n      const KEY = 'reb_world_topo_110m';\n      let raw = null;\n      try { raw = localStorage.getItem(KEY); } catch (e) {}\n      if (!raw) {\n        const r = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');\n        raw = await r.text();\n        try { localStorage.setItem(KEY, raw); } catch (e) {}\n      }\n      const topo = JSON.parse(raw);\n      this._topoFeat = window.topojson.feature(topo, topo.objects.countries);\n      return this._topoFeat;\n    })();\n    return this._topoLoading;\n  }\n\n  async drawMap() {\n    const elR = document.getElementById('reb-map-regional');\n    const elW = document.getElementById('reb-map-world');\n    const el = elR || elW;\n    if (!el) return;\n    const mode = elR ? 'regional' : 'world';\n    const patho = this.state.mapPatho || 'ebola_bdb';\n    const key = mode + '|' + patho + '|' + el.clientWidth + '|' + el.clientHeight;\n    if (this._mapKey === key && el.querySelector('svg')) return;\n    const ok = await this.waitLibs();\n    if (!ok) return;\n    let feat;\n    try { feat = await this.ensureTopo(); } catch (e) { return; }\n    const cur = document.getElementById(mode === 'regional' ? 'reb-map-regional' : 'reb-map-world');\n    if (!cur) return;\n    this._mapKey = key;\n    this.renderMap(cur, feat, mode, patho);\n  }\n\n  renderMap(el, feat, mode, patho) {\n    const d3 = window.d3;\n    const W = el.clientWidth || 800, H = el.clientHeight || 440;\n    const ld = el.querySelector('.reb-map-loading'); if (ld) ld.style.display = 'none';\n    d3.select(el).selectAll('svg').remove();\n    const svg = d3.select(el).append('svg')\n      .attr('width', W).attr('height', H)\n      .style('display', 'block').style('position', 'absolute').style('inset', '0');\n\n    // Palettes\n    const FILL = { 0:'#eef1f5', 1:'#fdf3d6', 2:'#fce8d8', 3:'#fbe3e3', 4:'#fbe3e3' };\n    const STROKE = { 0:'#dfe5ec', 1:'#e3c873', 2:'#e6ac7e', 3:'#e09a9a', 4:'#e09a9a' };\n    const DOT = { 0:'#cdd4de', 1:'#d8a72b', 2:'#e2853a', 3:'#e2853a', 4:'#d4453f' };\n\n    // Niveaux régionaux (alerte courante) — noms anglais topo -> niveau\n    const HM = (this.HM && this.HM[patho]) || {};\n    const EN2LV = {\n      'Dem. Rep. Congo': HM['RDC'], 'Uganda': HM['Ouganda'], 'Tanzania': HM['Tanzanie'],\n      'Mozambique': HM['Mozambique'], 'Madagascar': HM['Madagascar'],\n    };\n    // Diffusion mondiale (indicative) par pathogène\n    const GW = (this.GLOBAL && this.GLOBAL[patho]) || {};\n\n    const proj = mode === 'regional'\n      ? d3.geoMercator().fitExtent([[16,16],[W-16,H-16]], { type:'MultiPoint', coordinates:[[10,13],[63,-27]] })\n      : d3.geoNaturalEarth1().fitExtent([[4,6],[W-4,H-6]], { type:'Sphere' });\n    const path = d3.geoPath(proj);\n\n    const root = svg.append('g');\n    if (mode === 'world') {\n      root.append('path').datum({ type:'Sphere' }).attr('d', path)\n        .attr('fill', '#eaf2f9').attr('stroke', '#d4e0ec');\n    }\n\n    const lvlOf = d => mode === 'regional' ? EN2LV[d.properties.name] : GW[d.properties.name];\n    const frName = n => (this.EN_FR && this.EN_FR[n]) || n;\n    // Carte mondiale : niveau 1 = cas sporadique/importé (signal ponctuel) → fond très pâle + marqueur,\n    // niveaux 2-3 = circulation de zone → aplat plein.\n    const worldFill = (lv) => lv === 1 ? '#fbf4e0' : FILL[lv];\n    const countries = root.append('g').selectAll('path').data(feat.features).join('path')\n      .attr('d', path)\n      .attr('fill', d => { const lv = lvlOf(d); return lv ? (mode === 'world' ? worldFill(lv) : FILL[lv]) : (mode === 'world' ? '#dde6ef' : '#e6edf3'); })\n      .attr('stroke', d => { const lv = lvlOf(d); return lv ? STROKE[lv] : '#cdd8e2'; })\n      .attr('stroke-width', d => { const lv = lvlOf(d); return lv ? 1 : 0.5; })\n      .attr('vector-effect', 'non-scaling-stroke')\n      .style('cursor', 'pointer')\n      .on('mouseover', function(){ d3.select(this).attr('stroke', '#006bcd').attr('stroke-width', 1.4).raise(); })\n      .on('mouseout', function(event, d){ const lv = lvlOf(d); d3.select(this).attr('stroke', lv ? STROKE[lv] : '#cdd8e2').attr('stroke-width', lv ? 1 : 0.5); })\n      .on('click', (event, d) => { this.onPick(d.properties.name, mode, false); });\n    countries.append('title').text(d => { const lv = lvlOf(d); const sfx = (mode === 'world' && lv === 1) ? ' — cas sporadique / importé' : ''; return frName(d.properties.name) + sfx; });\n\n    // Marqueurs « signal ponctuel » pour les cas sporadiques/importés (carte mondiale, niveau 1)\n    if (mode === 'world') {\n      // Certains pays ont un centroïde géographique trompeur dans le fond world-atlas :\n      // « France » inclut la Guyane → son centroïde tombe près de l'Espagne. On force\n      // une position métropolitaine pour ces cas afin que le marqueur soit au bon endroit.\n      const MARK_LONLAT = { 'France':[2.4,46.6], 'Norway':[9,61.5], 'United States of America':[-98,39.5], 'Netherlands':[5.3,52.1] };\n      const spor = feat.features.filter(d => GW[d.properties.name] === 1);\n      const mg = root.append('g').style('pointer-events', 'none');\n      spor.forEach(d => {\n        const ov = MARK_LONLAT[d.properties.name];\n        let c; try { c = ov ? proj(ov) : path.centroid(d); } catch (e) { return; }\n        if (!c || isNaN(c[0]) || isNaN(c[1])) return;\n        const g = mg.append('g').attr('transform', `translate(${c[0]},${c[1]})`);\n        g.append('circle').attr('r', 4.5).attr('fill', 'none').attr('stroke', '#d8a72b').attr('stroke-width', 1.6).attr('vector-effect', 'non-scaling-stroke');\n        g.append('circle').attr('r', 1.4).attr('fill', '#d8a72b');\n      });\n    }\n\n    // Zoom molette (carte mondiale)\n    if (mode === 'world') {\n      const zoom = d3.zoom().scaleExtent([1, 8])\n        .on('zoom', (event) => { root.attr('transform', event.transform); });\n      svg.call(zoom).on('dblclick.zoom', null);\n      svg.on('dblclick', () => svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity));\n    }\n\n    // Marqueurs îles (régional uniquement)\n    if (mode === 'regional') {\n      const ISL = [\n        { z:'Comores', c:[43.3,-11.7] }, { z:'Mayotte', c:[45.17,-12.83] },\n        { z:'Seychelles', c:[55.5,-4.6] }, { z:'Maurice', c:[57.5,-20.3] },\n        { z:'La Réunion', c:[55.5,-21.1] },\n      ];\n      const g = svg.append('g');\n      ISL.forEach(({ z, c }) => {\n        const p = proj(c); if (!p) return;\n        const lv = HM[z] || 0;\n        const node = g.append('g').attr('transform', `translate(${p[0]},${p[1]})`).style('cursor', 'pointer')\n          .on('click', () => this.onPick(z, 'regional', true));\n        node.append('circle').attr('r', 9).attr('fill', '#fff').attr('stroke', DOT[lv]).attr('stroke-width', 2.5)\n          .append('title').text(`${z} — niveau ${lv}`);\n        node.append('circle').attr('r', 5).attr('fill', DOT[lv]).style('pointer-events', 'none');\n        node.append('text').attr('x', 13).attr('y', 4).attr('font-size', '10.5px').attr('font-weight', '600')\n          .attr('fill', '#3c4757').style('pointer-events', 'none')\n          .text(z === 'La Réunion' ? 'La Réunion' : z)\n          .clone(true).lower().attr('stroke', 'rgba(255,255,255,.85)').attr('stroke-width', 3);\n      });\n    }\n  }\n\n  renderVals() {\n    const D = this.state.data || {};\n    const A = {\n      1:{label:'Surveillance',     bg:'#e7f4ea',border:'#9ccba8',text:'#2c7a44',dot:'#3f9e57'},\n      2:{label:'Veille renforcée', bg:'#fdf3d6',border:'#e3c873',text:'#8a6312',dot:'#d8a72b'},\n      3:{label:'Alerte',           bg:'#fce8d8',border:'#e6ac7e',text:'#a85a1c',dot:'#e2853a'},\n      4:{label:'Urgence',          bg:'#fbe3e3',border:'#e09a9a',text:'#b32525',dot:'#d4453f'},\n    };\n    A[0] = {label:'Aucun signal', bg:'#f1f4f8', border:'#dbe1ea', text:'#8a93a1', dot:'#cdd4de'};\n    const badge = lvl => `background:${A[lvl].bg};color:${A[lvl].text};border:1px solid ${A[lvl].border};font-size:11px;font-weight:700;padding:3px 10px;border-radius:6px;white-space:nowrap`;\n    const stat = (cas,dec) => cas==null ? 'circulation active' : (dec!=null ? `${cas.toLocaleString('fr-FR')} cas · ${dec} décès` : `${cas.toLocaleString('fr-FR')} cas`);\n\n    // ── Fraîcheur des données (aujourd'hui = 28/06/2026) ──\n    const TODAY = new Date();\n    const freshness = (dateStr) => {\n      const m = /^(\\d{2})\\/(\\d{2})\\/(\\d{4})$/.exec(dateStr || '');\n      if (!m) return { label:'cadence saisonnière', age:null, dot:'#cdd4de', bg:'#f1f4f8', text:'#79828f', border:'#dbe1ea' };\n      const d = new Date(+m[3], +m[2]-1, +m[1]);\n      const age = Math.round((TODAY - d) / 86400000);\n      const ago = age <= 0 ? \"aujourd'hui\" : age === 1 ? 'hier' : `il y a ${age} j`;\n      if (age <= 10) return { label:`à jour · ${ago}`, age, dot:'#3f9e57', bg:'#e7f4ea', text:'#2c7a44', border:'#9ccba8' };\n      if (age <= 30) return { label:`à vérifier · ${ago}`, age, dot:'#d8a72b', bg:'#fdf3d6', text:'#8a6312', border:'#e3c873' };\n      return { label:`à réactualiser · ${ago}`, age, dot:'#d4453f', bg:'#fce8d8', text:'#a85a1c', border:'#e6ac7e' };\n    };\n    const freshPill = (f) => `display:inline-flex;align-items:center;gap:5px;background:${f.bg};color:${f.text};border:1px solid ${f.border};font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap`;\n\n    const rawAlerts = D.alerts || [\n      {name:'Ebola Bundibugyo', group:'Fièvre hémorragique virale', lvl:4, period:'cumul depuis le début de l\\u2019épidémie (déclarée 17/05) · arrêté au 24/06/2026',\n        zones:[{zone:'RDC',l:4,cas:1155,dec:304},{zone:'Ouganda',l:4,cas:19,dec:2}]},\n      {name:'Mpox (clade Ib)', group:'Orthopoxvirose', lvl:3, period:'cumul depuis le début de l\\u2019épidémie · arrêté au 12/06/2026',\n        zones:[{zone:'Madagascar',l:3,cas:2049,dec:7}]},\n      {name:'Choléra', group:'Maladie entérique', lvl:2, period:'cumul depuis le début de l\\u2019épisode · arrêté au 21/02/2026',\n        zones:[{zone:'Comores',l:2,cas:105,dec:6}]},\n      {name:'Dengue', group:'Arbovirose', lvl:2, period:'saison 2026 · circulation en cours (pas de comptage cumulé)',\n        zones:[{zone:'La Réunion',l:2,cas:null},{zone:'Mayotte',l:2,cas:null},{zone:'Madagascar',l:2,cas:null}]},\n      {name:'Leptospirose', group:'Zoonose', lvl:2, period:'endémique · pic saisonnier janv.–avr. 2026',\n        zones:[{zone:'La Réunion',l:2,cas:null}]},\n      {name:'Peste', group:'Zoonose', lvl:2, period:'endémique · cas sporadiques saison 2026',\n        zones:[{zone:'Madagascar',l:2,cas:null}]},\n      {name:'Chikungunya', group:'Arbovirose', lvl:1, period:'endémique Océan Indien · surveillance vectorielle continue',\n        zones:[{zone:'La Réunion',l:1,cas:null},{zone:'Mayotte',l:1,cas:null}]},\n    ];\n    const alerts = rawAlerts.map(a => ({\n      name:a.name, group:a.group, period:a.period,\n      badgeStyle:badge(a.lvl), badgeLabel:A[a.lvl].label,\n      // Référentiel du niveau affiché (Risque OMS, Phase ORSEC, Règle REB RUN), écrit par le moteur\n      zones:a.zones.map(z => ({ zone:z.zone, dot:A[z.l].dot, stat:stat(z.cas,z.dec) + (z.note ? ` — ${z.note}` : ''),\n        hasBasis: !!z.basis, basisLabel: z.basis || '', basisTitle: z.basisWhy || '',\n        basisStyle: z.basis === 'Risque OMS' ? 'background:#e6f0fb;color:#006bcd' : (z.basis === 'Phase ORSEC (ARS)' ? 'background:#e7f4ea;color:#2c7a44' : 'background:#eef1f5;color:#5d6675') })),\n    }));\n\n    // ── KPI d'accueil : TOUJOURS recalculés ici depuis les alertes ────────────────\n    // Un bloc `kpi` précalculé traînait dans donnees.json et prenait le dessus : quand\n    // les chiffres d'une alerte bougeaient, le gros total ne suivait pas et contredisait\n    // sa propre ventilation juste en dessous (2 199 décès affichés pour 3 087 détaillés).\n    // Les valeurs dérivables le sont donc en direct ; D.kpi ne sert plus que de repli\n    // pour ce qui ne se déduit pas des alertes (ex. pathogenesTotal).\n    const kpiLive = (() => {\n      const LBL = {0:'Aucun signal',1:'Surveillance',2:'Veille renforcée',3:'Alerte',4:'Urgence'};\n      let deces = 0, maxL = 0, maxWhat = ''; const foyers = new Set();\n      rawAlerts.forEach(a => {\n        (a.zones||[]).forEach(z => { if (z.dec) deces += z.dec; if ((z.l||0) >= 3) foyers.add(z.zone); });\n        if ((a.lvl||0) > maxL) { maxL = a.lvl; maxWhat = a.name + ((a.zones&&a.zones[0]) ? ' · '+a.zones[0].zone : ''); }\n      });\n      return { foyersActifs:foyers.size, foyersLabel:[...foyers].join(' · ')||'—', deces,\n        pathogenesEnAlerte:rawAlerts.length, pathogenesTotal:12,\n        niveauMaxLabel:LBL[maxL]||'—', niveauMaxWhat:maxWhat||'—' };\n    })();\n    const K = { ...(D.kpi || {}), ...kpiLive };\n    const kpiFoyers = String(K.foyersActifs);\n    const kpiDeces = (K.deces).toLocaleString('fr-FR');\n    const kpiPathAlerte = String(K.pathogenesEnAlerte);\n    const kpiNiveau = K.niveauMaxLabel;\n    const kpiNiveauWhat = K.niveauMaxWhat;\n    // Niveau numérique correspondant (pour la couleur du badge \"Risque global\") — retrouvé\n    // en inversant le libellé plutôt qu'en supposant un niveau fixe.\n    const kpiNiveauLvl = Object.keys(A).map(Number).find(l => A[l].label === kpiNiveau) ?? 0;\n    const headerRiskDot = A[kpiNiveauLvl].dot;\n    const headerRiskStyle = `display:inline-flex;align-items:center;gap:6px;margin-top:3px;background:${A[kpiNiveauLvl].bg};border:1px solid ${A[kpiNiveauLvl].border};color:${A[kpiNiveauLvl].text};padding:3px 11px;border-radius:6px;font-size:12px;font-weight:700`;\n    const onGoAlertes = () => this.setState({ view:'alertes', sel:null });\n    // Détail des décès par agent infectieux + période de comptage (« arrêté au … »)\n    const kpiDecesByAgent = rawAlerts.map(a => {\n      const dec = (a.zones||[]).reduce((s,z) => s + (z.dec||0), 0);\n      const m = (a.period||'').match(/arrêté au\\s+(\\d{1,2}\\/\\d{1,2}\\/\\d{2,4})/);\n      const per = m ? `au ${m[1]}` : (a.period||'');\n      return { name:a.name, decN:dec, dec:dec.toLocaleString('fr-FR'), period:per };\n    }).filter(a => a.decN > 0).sort((x,y) => y.decN - x.decN);\n\n    const rawJournal = D.journal || [\n      {date:'25/06', l:4, path:'Ebola Bundibugyo', src:'ECDC', text:\"RDC : 1 155 cas confirmés et 304 décès (Ituri 1 054, Nord-Kivu 98, Sud-Kivu 3). Cas importé confirmé en France le 24/06 (évacuation sanitaire depuis la zone d'épidémie) — vigilance renforcée aux points d'entrée.\"},\n      {date:'01/06', l:4, path:'Ebola Bundibugyo', src:'OMS DON', text:\"Confirmation de l'épidémie en RDC (Nord-Kivu). Transmission transfrontalière vers l'Ouganda confirmée. Préparation activée au CHU.\"},\n      {date:'28/05', l:3, path:'Mpox', src:'ECDC', text:\"Augmentation des cas clade Ib en RDC, extension documentée vers l'Ouganda. Vigilance renforcée aux points d'entrée.\"},\n      {date:'22/02', l:2, path:'Choléra', src:'OMS', text:\"105 cas confirmés aux Comores (6 décès), importés depuis la Tanzanie. Surveillance renforcée à Mayotte.\"},\n    ];\n    const journal = rawJournal.map(j => ({\n      path:j.path, dot:A[j.l].dot, meta:`${j.date} · ${j.src}`, text:j.text,\n    }));\n    const onOpenJournal = () => this.setState({ view:'journal', sel:null });\n\n    // Navigation regroupée : 8 entrées à plat se lisaient comme une liste indifférenciée.\n    // Trois familles — ce qu'on regarde d'abord, la cartographie, l'analyse — plus le bloc\n    // \"Références\" (sources, journal) descendu en pied de barre.\n    const navDef = [\n      {id:'accueil',  icon:'▦', label:'Accueil',          grp:'Vue d’ensemble'},\n      {id:'alertes',  icon:'⚑', label:'Alertes',          grp:'Vue d’ensemble'},\n      {id:'signal',   icon:'◉', label:'Signal précoce',   grp:'Vue d’ensemble'},\n      {id:'carte',    icon:'◍', label:'Carte',            grp:'Cartographie'},\n      {id:'chaleur',  icon:'▤', label:'Carte de chaleur', grp:'Cartographie'},\n      {id:'pays',     icon:'⌖', label:'Fiche pays',       grp:'Cartographie'},\n      {id:'courbes',  icon:'∿', label:'Courbes',          grp:'Analyse'},\n      {id:'synthese', icon:'☰', label:'Synthèse',         grp:'Analyse'},\n    ];\n    const MONDIAL_TABS = ['carte','alertes','signal'];\n    const navScopeMondial = (this.state.scope || 'regional') === 'mondial';\n    const navVisible = navDef.filter(n => !navScopeMondial || MONDIAL_TABS.includes(n.id));\n    const navItem = n => ({\n      icon:n.icon, label:n.label,\n      isActive: this.state.view===n.id,\n      inactive: this.state.view!==n.id,\n      onClick: () => this.setState({ view:n.id, sel:null }),\n    });\n    const nav = navVisible.map(navItem);\n    const navGroups = [...new Set(navVisible.map(n => n.grp))].map(label => ({\n      label, items: navVisible.filter(n => n.grp === label).map(navItem),\n    }));\n    const sourcesActive = this.state.view === 'sources';\n\n    const fmt = v => v==null ? 'NA' : v.toLocaleString('fr-FR');\n    const rawSynth = D.synth || [\n      {name:'Ebola Bundibugyo', lvl:4, source:'ECDC / MoH RDC', date:'24/06/2026', period:'cumul depuis le 17/05/2026',\n        rows:[\n          {zone:'RDC', conf:1155, dec:304, susp:null},\n          {zone:'Ouganda', conf:19, dec:2, susp:null},\n          {zone:'TOTAL', conf:1174, dec:306, susp:null, total:true},\n        ]},\n      {name:'Mpox (clade Ib)', lvl:3, source:'MoH Madagasc ]||{})[z] || 0, c = LV[lvl], p = ZPOS[z];\n      return {\n        label: lvl>0 ? String(lvl) : '·', zname:z,\n        wrapStyle:`position:absolute;left:${p[0]}%;top:${p[1]}%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;z-index:${lvl>0?2:1}`,\n        dotStyle:`width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:${c.bg};border:2px solid ${c.border};color:${c.text};box-shadow:0 2px 6px rgba(20,30,50,.18)`,\n        nameStyle:`font-size:10px;font-weight:600;color:#3c4757;white-space:nowrap;background:rgba(255,255,255,.82);padding:1px 5px;border-radius:4px`,\n      };\n    });\n    const mapOptions = PATHOS.map(p => ({ id:p.id, name:p.name }));\n    const onMapChange = e => this.setState({ mapPatho:e.target.value });\n\n    // ── Carte de chaleur (lignes à plat) ──\n    const NAMEMAP = {}; PATHOS.forEach(p => NAMEMAP[p.id]=p.name);\n\n    // ── Courbes — graphique dynamique construit depuis D.epiSeries ──\n    const courbeSel = this.state.courbeSel || 'ebola_bdb';\n    const onCourbeSel = e => this.setState({ courbeSel: e.target.value });\n    const courbeOptions = PATHOS.map(p => ({ id:p.id, name:p.name }));\n    const series = (D.epiSeries && D.epiSeries[courbeSel]) || [];\n    const hasSeries = series.length >= 2;\n    let chart = null;\n    if (hasSeries) {\n      const padL=44, padR=15, padT=15, padB=28, W=600, H=200;\n      const plotW = W-padL-padR, plotH = H-padT-padB;\n      const maxCas = Math.max(...series.map(p => p.cas||0));\n      const niceMax = Math.max(10, Math.ceil(maxCas / Math.pow(10, String(Math.floor(maxCas)).length-1)) * Math.pow(10, String(Math.floor(maxCas)).length-1));\n      const x = i => padL + (series.length>1 ? (i/(series.length-1))*plotW : 0);\n      const y = v => padT + plotH - Math.min(1, (v||0)/niceMax)*plotH;\n      const casPts = series.map((p,i) => `${x(i).toFixed(1)},${y(p.cas).toFixed(1)}`);\n      const decPts = series.map((p,i) => `${x(i).toFixed(1)},${y(p.dec).toFixed(1)}`);\n      const hasDec = series.some(p => p.dec != null && p.dec > 0);\n      const last = series[series.length-1], prev = series[series.length-2];\n      const delta = (last.cas||0) - (prev.cas||0);\n      const hov = this.state.courbeHover;\n      chart = {\n        casPolyline: casPts.join(' '),\n        decPolyline: hasDec ? decPts.join(' ') : null,\n        hasDec,\n        areaPath: `M${x(0).toFixed(1)},${(padT+plotH).toFixed(1)} L${casPts.join(' L')} L${x(series.length-1).toFixed(1)},${(padT+plotH).toFixed(1)} Z`,\n        gridLines: [0, 0.5, 1].map(f => {\n          const yy = padT+plotH*(1-f);\n          return { y:yy.toFixed(1), topPct:(yy/200*100).toFixed(2), label: Math.round(niceMax*f).toLocaleString('fr-FR') };\n        }),\n        dots: series.map((p,i) => ({\n          cx:x(i).toFixed(1), cy:y(p.cas).toFixed(1),\n          onEnter: () => this.setState({ courbeHover: { i, date:p.date, cas:p.cas, dec:p.dec, cx:x(i), cy:y(p.cas) } }),\n          onLeave: () => this.setState({ courbeHover: null }),\n          active: !!hov && hov.i === i,\n        })),\n        decDots: hasDec ? series.map((p,i) => ({\n          cx:x(i).toFixed(1), cy:y(p.dec).toFixed(1),\n          onEnter: () => this.setState({ courbeHover: { i, date:p.date, cas:p.cas, dec:p.dec, cx:x(i), cy:y(p.dec) } }),\n          onLeave: () => this.setState({ courbeHover: null }),\n        })) : [],\n        xLabels: series.map((p,i) => ({ leftPct:(x(i)/600*100).toFixed(2), label:p.date })),\n        lastX: x(series.length-1).toFixed(1), lastY: Math.max(12, y(last.cas)-8).toFixed(1),\n        lastLeftPct: (x(series.length-1)/600*100).toFixed(2), lastTopPct: (Math.max(12, y(last.cas)-8)/200*100).toFixed(2),\n        lastLabel: (last.cas||0).toLocaleString('fr-FR'),\n        lastDecLeftPct: (x(series.length-1)/600*100).toFixed(2),\n        lastDecTopPct: (hasDec ? Math.min(188, y(last.dec)+14)/200*100 : 0).toFixed(2),\n        lastDecLabel: hasDec ? (last.dec||0).toLocaleString('fr-FR') : '',\n        lectureText: delta === 0\n          ? `Stable depuis le point précédent (${prev.date}).`\n          : `${delta > 0 ? '+' : ''}${delta.toLocaleString('fr-FR')} cas depuis le ${prev.date} (point précédent), arrêté au ${last.date}.`,\n        metaText: `Cas confirmés cumulés${hasDec ? ' · décès en pointillés' : ''} · arrêté au ${last.date}`,\n        tipVisible: !!hov,\n        tipLeftPct: hov ? (hov.cx/600*100) : 0,\n        tipTopPct: hov ? (hov.cy/200*100) : 0,\n        tipText: hov ? `${hov.date} · ${hov.cas.toLocaleString('fr-FR')} cas${hov.dec!=null?` · ${hov.dec.toLocaleString('fr-FR')} décès`:''}` : '',\n      };\n    }\n    const GROUPS = [\n      {label:'Fièvres hémorragiques virales', ids:['ebola_bdb','marburg','lassa','cchf','rvf']},\n      {label:'Arboviroses', ids:['dengue','chikv']},\n      {label:'Zoonoses', ids:['plague','lepto']},\n      {label:'Maladies entériques', ids:['cholera']},\n      {label:'Orthopoxviroses', ids:['mpox']},\n      {label:'Respiratoires sévères', ids:['mers']},\n    ];\n    const heatRows = [];\n    GROUPS.forEach(g => {\n      heatRows.push({ isGroup:true, isPatho:false, label:g.label });\n      g.ids.forEach(id => {\n        heatRows.push({ isGroup:false, isPatho:true, name:NAMEMAP[id],\n          cells: ZONES.map(z => {\n            const lvl = (HM[id]||{})[z] || 0, c = LV[lvl];\n            return { label: lvl>0?String(lvl):'·',\n              style:`background:${c.bg};color:${c.text};text-align:center;padding:8px 2px;font-size:11px;font-weight:${lvl>0?700:400};border:1px solid #fff` };\n          }) });\n      });\n    });\n    const heatCols = ZSHORT;\n\n    // Lien vers la dernière veille COREB sur les fiches des FHV qu'elle couvre le mieux\n    // (FHCC, Lassa) et sur tout pathogène repéré dans son dernier numéro.\n    const CBV = D.corebVeille || null;\n    const corebFor = (id) => {\n      if (!CBV || !CBV.url) return { hasCorebLink:fa
